<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>情緒花園</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F8F5EF">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="情緒花園">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block" rel="stylesheet">
<style>
:root{--bg:#F8F5EF;--pink:#F5C7D5;--yel:#F5DEA0;--mint:#B9D9C2;--sky:#B9D8EB;--lav:#D4C7EA;--ink:#5B5A55;--gl:rgba(255,252,247,.8);--sh:0 10px 30px rgba(120,100,90,.18)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:600 15px/1.45 Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#86B6DA,#B4D3E2 55%,#D6DDD0);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,.logo,.fab,.big{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,textarea:focus-visible{outline:3px solid #8DB9E8;outline-offset:2px}
.glass{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;box-shadow:var(--sh);border:1px solid #fff9}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font-size:22px;white-space:nowrap;background:var(--gl);padding:8px 16px;border-radius:99px;box-shadow:var(--sh)}
#date{white-space:nowrap;background:var(--gl);padding:8px 14px;border-radius:99px;font-size:13px}
.hello{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 72px);padding:16px 20px;max-width:310px}
.hello h1{font-size:19px;line-height:1.2}.hello p{margin:4px 0 10px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#fff;border-radius:99px;padding:3px 11px;font-size:12.5px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:#F29BB5;color:#fff;padding:15px 24px;border-radius:99px;font-size:17px;box-shadow:0 10px 24px #f29bb577;transition:transform .2s}
.fab:hover{transform:scale(1.05) rotate(-1deg)}
nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--gl);backdrop-filter:blur(14px);box-shadow:var(--sh)}
nav button{padding:9px 16px;border-radius:99px;font-size:14px}
nav button{position:relative;z-index:1}
#pill{position:absolute;z-index:0;top:6px;bottom:6px;left:0;width:0;border-radius:99px;background:var(--pink);box-shadow:0 3px 10px #f29bb544;transition:transform .45s cubic-bezier(.34,1.4,.5,1),width .35s}
@media(prefers-reduced-motion:reduce){#pill{transition:none}}
/* 選單 bar 點擊彈跳：nav 靠 translateX(-50%) 置中，所以關鍵影格必須把 translateX(-50%) 一起寫進 transform，
   縮放才會以 bar 的正中央為中心（若改用獨立的 scale 屬性，縮放會疊在位移之後，中心點會偏到右邊）。
   動畫在「一次完整點擊」後由 JS 觸發，跑完固定時長（--nav-pop-dur）才收尾，與按住多久無關 */
nav{--nav-pop-dur:680ms}
@keyframes navpop{0%{transform:translateX(-50%) scale(1)}38%{transform:translateX(-50%) scale(1.075)}68%{transform:translateX(-50%) scale(.985)}100%{transform:translateX(-50%) scale(1)}}
nav.pop{transform-origin:50% 50%;animation:navpop var(--nav-pop-dur) cubic-bezier(.3,.7,.4,1) both}
body.rm nav.pop{animation:none}
@media(prefers-reduced-motion:reduce){nav.pop{animation:none}}
@media(min-width:1000px){nav{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}.fab{bottom:28px}}
@media(max-width:759px){.hello{right:16px;max-width:none}.hello p{display:none}.fab{right:16px}}
@media(max-width:480px){.logo{font-size:17px;padding:6px 12px}#date{font-size:12px;padding:6px 11px}}
/* 花園介面（標題、問候、按鈕）：切換分頁時淡入淡出＋輕微位移，而不是直接消失 */
.g{transition:opacity .4s ease .1s,translate .45s cubic-bezier(.2,.9,.3,1) .1s,visibility 0s}
.fab.g{transition:transform .2s,opacity .4s ease .1s,translate .45s cubic-bezier(.2,.9,.3,1) .1s,visibility 0s}
body:not([data-v=garden]) .g{opacity:0;visibility:hidden;pointer-events:none;translate:0 10px;transition:opacity .22s ease,translate .3s ease,visibility 0s .22s}
body:not([data-v=garden]) .top.g,body:not([data-v=garden]) .hello.g{translate:0 -10px}
.panel{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-48%);width:min(520px,calc(100% - 28px));max-height:calc(100% - 170px);overflow:auto;padding:22px}
@media(min-width:1000px){.panel{top:calc(50% + 28px)}}
/* 面板進出場：離場快速淡出，進場帶一點彈性浮起（用獨立的 translate / scale 屬性，不影響原本的置中 transform） */
.panel{opacity:0;scale:.12;transform-origin:var(--ox,50%) var(--oy,100%);pointer-events:none;transition:opacity .18s ease,scale .24s cubic-bezier(.5,0,.75,0)}
.panel.in{opacity:1;scale:1;pointer-events:auto;transition:opacity .28s ease .04s,scale .46s cubic-bezier(.2,.9,.3,1.12) .04s}
body.rm .panel,body.rm .panel.in,body.rm .g,body.rm .fab.g{translate:none!important;scale:none!important;transition:opacity .15s ease!important}
@media(prefers-reduced-motion:reduce){.panel,.panel.in,.g,.fab.g{translate:none!important;scale:none!important;transition:opacity .15s ease!important}}
/* 手機／窄螢幕：選單在底部，面板改成置中於「頂部標題列」與「底部選單」之間，高度也扣掉兩者，避免和選單重疊 */
@media(max-width:999px){.panel{--tb:calc(env(safe-area-inset-top,0px) + 62px);--bb:calc(env(safe-area-inset-bottom,0px) + 96px);top:calc(var(--tb) + (100% - var(--tb) - var(--bb))/2);transform:translate(-50%,-50%);max-height:calc(100% - var(--tb) - var(--bb))}}
.panel h2{font-size:24px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .w{font-size:12px;opacity:.6}
.d{aspect-ratio:1;border-radius:16px;background:#ffffff88;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.d i{font-style:normal;font-size:20px;margin-top:2px}
.d.e i{width:12px;height:12px;border-radius:50% 50% 50% 0;background:#ddd3c4;opacity:.7;margin-top:5px}
.d.t{outline:3px solid var(--yel)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh button{background:#fff;width:34px;height:34px;border-radius:50%}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bar b{flex:0 0 78px;font-weight:700}
.bar div{height:16px;border-radius:99px;transition:width .6s}
.wk{display:flex;gap:6px;justify-content:space-between;margin-top:6px}
.wk div{flex:1;text-align:center;font-size:11px}.wk i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-style:normal;font-size:18px;background:#fff9;margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px dashed #d9cfbe}
.btn{background:#fff;padding:9px 16px;border-radius:99px;box-shadow:0 3px 10px #0001}.btn.p{background:#F29BB5;color:#fff}.btn.r{color:#b5484f}.btn.w{background:#7DB8E6;color:#fff}
.scrim{position:fixed;inset:0;z-index:20;background:#5b5a5555;display:grid;place-items:center;padding:14px}
.scrim[hidden],[hidden]{display:none!important}
.sheet{background:#FFFCF7;border-radius:32px;padding:22px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:var(--sh)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.mc{border-radius:24px;padding:12px 4px;background:#fff;border:3px solid transparent;text-align:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mc b{display:block;font-size:34px;line-height:1.2}.mc span{font-size:13px}.mc small{display:block;font-size:11px;opacity:.7}
.mc:hover{transform:translateY(-3px)}.mc[aria-pressed=true]{transform:scale(1.07) rotate(-2deg);border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,#fff)}
#gfull{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:#FFF4DC;border:2px dashed #EBCB7A;font-size:14px;line-height:1.55}#gfull b{display:block;font:600 16px Fredoka,Nunito,sans-serif;margin-bottom:2px}
#ms:disabled{opacity:.4;cursor:default}
textarea{width:100%;border:2px solid #eadfcd;border-radius:18px;padding:10px 14px;font:inherit;font-size:16px;color:inherit;background:#fff;resize:none;height:76px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.tag{background:#fff;padding:5px 13px;border-radius:99px;border:2px solid #eadfcd;font-size:13px}.tag[aria-pressed=true]{background:var(--lav);border-color:#b7a2e0}
#card{position:fixed;z-index:6;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(310px,calc(100% - 32px));background:#FFFBF0;padding:18px 20px;border-radius:6px 22px 6px 22px;transform:rotate(1.2deg);box-shadow:var(--sh);border:2px dashed #e7d9b9}
@media(min-width:1000px){#card{bottom:90px}}
#card h2{font-size:21px}#card p{margin:8px 0;font-style:italic}
.toast{position:fixed;z-index:30;left:50%;top:22%;transform:translateX(-50%);background:#fffc;padding:12px 22px;border-radius:99px;box-shadow:var(--sh);font-family:Fredoka;font-size:19px;animation:tw 3.6s forwards}
@keyframes tw{0%{opacity:0;top:26%}12%,80%{opacity:1;top:22%}100%{opacity:0}}
#fb{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-size:17px}
#ob{position:fixed;inset:0;z-index:40;background:linear-gradient(#9FCBEA,#D6ECF4 45%,#BFE0A8 46%,#A6D58F);overflow:hidden}
.cl{position:absolute;background:#fff;border-radius:99px;box-shadow:inset 0 -8px 14px #cde4f2;width:130px;height:46px}
.bud{position:absolute;left:50%;top:15%;width:min(240px,60vw);aspect-ratio:1;transform:translateX(-50%);animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-10px) rotate(2deg)}}
.bud .hd{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE6EE,#F5C7D5 70%);box-shadow:inset -10px -14px 24px #e9a0b955,0 16px 30px #0002}
.bud .hd:before,.bud .hd:after{content:"";position:absolute;top:44%;width:9%;height:11%;border-radius:50%;background:#5b3a3a}
.bud .hd:before{left:30%}.bud .hd:after{right:30%}
.bud .sm{position:absolute;left:41%;top:55%;width:18%;height:9%;border-bottom:5px solid #5b3a3a;border-radius:0 0 50% 50%}
.bud .ck{position:absolute;top:56%;width:13%;height:9%;border-radius:50%;background:#f29bb588}
.bud .st{position:absolute;left:47%;top:96%;width:6%;height:120%;background:#9CCB8A;border-radius:99px}
.ob-s{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;padding:26px 24px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:12px;justify-items:center;text-align:center}
.ob-s h1{font-size:30px;line-height:1.1}
@media(min-width:760px){.ob-s{left:50%;transform:translateX(-50%);width:460px}}
@media(prefers-reduced-motion:reduce){.bud,.toast{animation:none}.toast{opacity:1}}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;font-size:1.3em;line-height:1;display:inline-block;vertical-align:-.25em;white-space:nowrap;font-variation-settings:'FILL' 1}
nav button{display:flex;align-items:center;gap:5px}
.logo{display:flex;align-items:center;gap:6px}.logo .ms{color:#F29BB5}
.chips span{display:inline-flex;align-items:center;gap:4px}
.hello h1{display:flex;align-items:center;gap:6px}.hello h1 .ms,.toast .ms{color:#F29BB5}
.toast{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:4px}
.mh button{display:grid;place-items:center}
.mc b svg{display:block;margin:0 auto}.mc small svg{vertical-align:-3px}
.d i svg,.wk i svg{display:block}
.bar b{display:flex;align-items:center;gap:4px;flex:0 0 100px}
html,body,*{touch-action:pan-x pan-y}canvas{touch-action:none}input[type=range]{touch-action:pan-y}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
textarea,#card p{-webkit-user-select:text;user-select:text}
.fab.sec{right:auto;left:16px;background:var(--gl);color:var(--ink);box-shadow:var(--sh);font-size:0;padding:0;width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(14px)}.fab.sec .ms{font-size:26px;vertical-align:0}body.arr #fab{display:none!important}
#wxc:empty{display:none}
nav button{font-size:0;padding:10px 16px;gap:0}nav .ms{font-size:24px}
nav{max-width:calc(100% - 16px)}
#card>div:last-child{flex-wrap:wrap}#card .btn{padding:8px 12px;font-size:14px}
@media(max-width:480px){nav button{font-size:0;padding:10px 15px;gap:0}nav .ms{font-size:24px}}

/* ---- loader ---- */
#ld{position:fixed;inset:0;z-index:50;background:linear-gradient(#9FCBEA,#D6ECF4 45%,#BFE0A8 46%,#A6D58F);overflow:hidden;transition:opacity .5s}#ld.out{opacity:0;pointer-events:none}
.ldm{font-size:17px;min-height:1.6em}.ldb{width:min(260px,70%);height:8px;border-radius:99px;background:#F5C7D5;overflow:hidden}.ldb i{display:block;height:100%;width:0;border-radius:99px;background:#F29BB5;transition:width .3s}#ld [hidden]{display:none!important}
/* ---- settings ---- */
#p-set{top:calc(env(safe-area-inset-top,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 88px);max-height:none;transform:translateX(-50%);padding:18px 12px 4px}
#p-set:not([hidden]){display:flex;flex-direction:column}
/* 寬螢幕：選單列移到頂部，設定面板需避開它（底部不再需要為選單留空間） */
@media(min-width:1000px){#p-set{top:calc(env(safe-area-inset-top,0px) + 86px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}}
#p-set h2{padding:0 8px 6px;flex:none}
.sbody{flex:1;min-height:0;overflow:auto;padding:0 2px 16px;-webkit-overflow-scrolling:touch}
#p-set .sbody{scrollbar-width:none;-ms-overflow-style:none}#p-set .sbody::-webkit-scrollbar{display:none;width:0;height:0}
.gqd{display:block;margin:8px 2px 0;font-size:12.5px;line-height:1.4}
.gqd .gqt{opacity:.65}
.gqd .gqn{display:block;margin-top:4px;color:#D64545;font-weight:700;opacity:1}
.sg{font-size:12px;letter-spacing:.06em;opacity:.65;margin:14px 10px 6px}
.sc{background:#ffffffb8;border-radius:22px;overflow:hidden}
.si{display:flex;align-items:center;gap:12px;padding:12px 14px}.si+.si{border-top:1px solid #0000000d}
.si.col{flex-direction:column;align-items:stretch;gap:0}.si.col .tags{margin:8px 0 0}
.sic.ms{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#E5DBF7;font-size:20px;vertical-align:0}
.sx{flex:1;min-width:0}.sx b{display:block;font-weight:600;font-size:15px}.sx small{display:block;opacity:.65;font-size:12.5px;line-height:1.35}
.sw{flex:none;width:48px;height:28px;border-radius:99px;background:#d9d2c6;position:relative;transition:background .3s ease}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0003;transition:transform .3s cubic-bezier(.34,1.35,.64,1)}
.sw[aria-checked=true]{background:#F29BB5}.sw[aria-checked=true]:after{transform:translateX(20px)}
.si.vol{padding-top:2px;padding-bottom:12px;gap:8px}
.si.vol .vi{flex:none;font-size:20px;opacity:.55;margin-left:2px}
.vr{flex:1;min-width:0;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.vr::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,#F29BB5 var(--p,50%),#d9d2c6 var(--p,50%))}
.vr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0003}
.vr::-moz-range-track{height:6px;border-radius:99px;background:#d9d2c6}
.vr::-moz-range-progress{height:6px;border-radius:99px;background:#F29BB5}
.vr::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0003}
.vr:disabled{opacity:.35;cursor:default}
.vo{flex:none;width:30px;text-align:right;font-size:13px;opacity:.65;font-variant-numeric:tabular-nums}
.sn{font-size:12.5px;opacity:.65;margin:14px 10px 0;text-align:center}

/* ---- account / sync ---- */
.ab{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 14px;margin-top:8px;border-radius:16px;font-weight:700;font-size:15px;background:#fff;border:1.5px solid #eadfcd;transition:transform .2s}
.ab:first-of-type{margin-top:0}.ab:hover:not(:disabled){transform:translateY(-1px)}.ab:disabled{opacity:.45;cursor:default}
.fab.sec{overflow:visible}#gb{left:78px}.fab.sec .gbd{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#F29BB5;color:#fff;font:600 12px/20px Fredoka,Nunito,sans-serif;text-align:center;box-shadow:0 2px 6px #0003}
.gi{flex:none;width:46px;height:46px;border-radius:14px;background:#E5DBF7;display:grid;place-items:center}
.paper{background:#FFFBF0;border:2px dashed #e7d9b9;border-radius:6px 22px 6px 22px;padding:18px 20px;transform:rotate(-1deg)}
.paper .gt{font-size:18px;line-height:1.55;margin:10px 0 2px;font-style:italic}
.gsh-h{display:flex;align-items:center;gap:8px;font-size:22px}#gsh .sc{margin-top:10px}.gpop{display:grid;place-items:center;margin:6px 0 8px}

/* ---- 小禮物圖鑑 ---- */
.dx-view{display:flex;flex-direction:column;max-height:calc(100vh - 72px);max-height:calc(100dvh - 72px)}
.dx-hd{flex:none;padding-bottom:12px;border-bottom:1px solid #0000000d}
.dx-body{flex:1;min-height:0;overflow:auto;margin:0 -22px;padding:16px 22px;overscroll-behavior:contain}
.dx-ft{flex:none;display:flex;justify-content:flex-end;padding-top:12px;border-top:1px solid #0000000d}
.dx-hd .gsh-h{margin:0}
.dx-sum{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:13px;white-space:nowrap}
.dx-bar{flex:1;height:10px;border-radius:99px;background:#0000000f;overflow:hidden}.dx-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#F5C7D5,#F29BB5);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.dx-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
@media(min-width:560px){.dx-g{grid-template-columns:repeat(4,1fr)}}
.dx-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;border-radius:20px;background:#fff;box-shadow:0 3px 10px #0001;transition:transform .2s,box-shadow .2s;min-width:0}
.dx-c:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0001}.dx-c:active{transform:scale(.97)}
.dx-c.no{background:#ffffff70;box-shadow:none;border:1.5px dashed #0000001f}
.dx-c.no svg,.dx-hero.no svg{filter:brightness(0);opacity:.14}
.dx-n{font:500 10.5px/1 Fredoka,Nunito,sans-serif;opacity:.42;letter-spacing:.02em}
.dx-t{font-size:12.5px;font-weight:600;line-height:1.25;text-align:center;overflow-wrap:anywhere;padding:0 2px}
.dx-s{font-size:11.5px;opacity:.7;line-height:1.3;display:flex;align-items:center;gap:6px;white-space:nowrap}.dx-c.no .dx-s{opacity:.45}

   400–559px（一般直式手機）：按鈕貼在選單列兩側、與它同一水平線；左側兩顆仍上下排列。
   ≥560px（橫式手機、平板）：左側兩顆改為橫排，同樣與選單列同一水平線。

<script>
/* 統一錯誤記錄：原本許多 catch(e){logErr(e)} 會把錯誤吞掉。現在改記到 console（同一則訊息只印一次，最多 40 則，避免每幀重複洗版）。
   可在 console 輸入 __errs 查看累積的錯誤。 */
const __errs=[];
function logErr(e){try{const m=String(e&&e.stack||e).split('\n').slice(0,2).join(' @ ');if(__errs.includes(m)||__errs.length>=40)return;__errs.push(m);console.warn('[mg]',m)}catch(_){logErr(_)}}
/* 停用整頁縮放（花園本身的縮放不受影響） */
(function(){
  const stop=e=>e.preventDefault();
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,stop,{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
  document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false,capture:true});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','_','0'].includes(e.key))e.preventDefault()},true);
  document.addEventListener('dblclick',e=>{if(!/^(TEXTAREA|INPUT)$/.test(e.target.tagName))e.preventDefault()},true);
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!/^(TEXTAREA|INPUT)$/.test((document.activeElement||{}).tagName))scrollTo(0,0)},60));
})();
</script>

<script>
/* ===== 音效系統 =====
   進站時先預載全部音檔（見載入畫面）。檔案不存在或無法解碼時不播放、不報錯，
   只在主控台印出 [audio] 警告，方便找出是哪個檔案有問題。 */
const SND={
  vol:{sfx:.7,amb:.35},
  sfx:{
    click:'audio/sfx/click.wav',animal:'audio/sfx/animal.wav',flower:'audio/sfx/flower.wav',island:'audio/sfx/island.wav',sendoff:'audio/sfx/sendoff.wav',
    plant:'audio/sfx/plant.wav',water:'audio/sfx/water.wav',gift_drop:'audio/sfx/gift_drop.wav',gift_open:'audio/sfx/gift_open.wav',decor_place:'audio/sfx/decor_place.wav',delete:'audio/sfx/delete.wav',bloom:'audio/sfx/bloom.wav',move:'audio/sfx/move.wav',rotate:'audio/sfx/rotate.wav',deny:'audio/sfx/deny.wav',
    animal_bee:'audio/sfx/animal_bee.wav',animal_bird:'audio/sfx/animal_bird.wav',animal_ladybug:'audio/sfx/animal_ladybug.wav',
    animal_butterfly:'audio/sfx/animal_butterfly.wav',animal_snail:'audio/sfx/animal_snail.wav',animal_frog:'audio/sfx/animal_frog.wav',leaf_float:'audio/sfx/leaf_float.wav'
  },
  weather:{
    happy:'audio/weather/fresh-breeze.wav',excited:'audio/weather/rainbow.wav',calm:'audio/weather/breezy.wav',
    loved:'audio/weather/petal-rain.wav',sad:'audio/weather/light-rain.wav',anxious:'audio/weather/clouds-wind.wav'
  }
};
const SNDS={},SB={},RAW={},WB={};
const SLP={on:false,cbs:[]};   /* 睡眠模式旗標；cbs＝喚醒時要重新啟動的動畫迴圈 */
let AC=null,sndUnlocked=false,ambKey=null,ambCur=null,ambTok=0;
const sfxOn=()=>{try{return S.snd!==false}catch(e){return true}};
const ambOn=()=>{try{return S.amb!==false}catch(e){return true}};
function sndVolSync(){try{SND.vol.sfx=(S.vs==null?70:S.vs)/100;SND.vol.amb=(S.va==null?35:S.va)/100}catch(e){logErr(e)}}   /* 把設定裡的音量滑桿值（0–100）同步到播放用的音量 */
function acx(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended'&&sndUnlocked)AC.resume();
    return AC;
  }catch(e){return null}
}
/* 預載：音效解碼成 AudioBuffer，背景音先存原始資料（用到時才解碼，省記憶體） */
function sndPreload(onTick){
  const items=[];
  for(const k in SND.sfx)items.push(['s',k,SND.sfx[k]]);
  for(const k in SND.weather)items.push(['w',k,SND.weather[k]]);
  let done=0;
  return Promise.all(items.map(([t,k,src])=>{
    const el=()=>{try{const a=new Audio(),r={a,bad:false};a.preload='auto';a.loop=t==='w';a.addEventListener('error',()=>{r.bad=true});a.src=src;SNDS[t+':'+k]=r}catch(e){logErr(e)}};
    return fetch(src)
      .then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
      .then(buf=>{
        if(t==='w'){RAW[k]=buf;return}
        const c=acx();if(!c)throw 0;
        return new Promise((ok,no)=>c.decodeAudioData(buf,x=>{SB[k]=x;ok()},no));
      })
      .catch(()=>{console.warn('[audio] 無法載入或解碼：'+src);el()})
      .then(()=>{done++;onTick&&onTick(done,items.length)});
  }));
}
function sfx(name,fallback){
  try{
    if(!sfxOn()||SLP.on)return;sndVolSync();
    const k=SB[name]?name:(fallback&&SB[fallback]?fallback:null);
    if(k&&acx()){
      const s=AC.createBufferSource(),g=AC.createGain();
      s.buffer=SB[k];g.gain.value=SND.vol.sfx;s.connect(g);g.connect(AC.destination);s.start();return;
    }
    let r=SNDS['s:'+name];if(!r||r.bad)r=fallback&&SNDS['s:'+fallback];if(!r||r.bad)return;
    const n=r.a.cloneNode();n.volume=SND.vol.sfx;const p=n.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){logErr(e)}
}
function sndFade(a,to,done){
  clearInterval(a._f);
  a._f=setInterval(()=>{
    const d=to-a.volume;
    if(Math.abs(d)<.02){a.volume=Math.max(0,Math.min(1,to));clearInterval(a._f);done&&done();return}
    a.volume=Math.max(0,Math.min(1,a.volume+Math.sign(d)*.02));
  },60);
}
function wbGet(k){
  if(!WB[k]){
    for(const o in WB)if(o!==k)delete WB[o];
    WB[k]=(RAW[k]?Promise.resolve(RAW[k].slice(0)):fetch(SND.weather[k]).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}))
      .then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)))
      .catch(()=>null);
  }
  return WB[k];
}
function wbStart(k,buf){
  const g=AC.createGain();g.gain.value=0;g.connect(AC.destination);
  const s=AC.createBufferSource();s.buffer=buf;s.loop=true;s.connect(g);s.start();
  g.gain.setTargetAtTime(SND.vol.amb,AC.currentTime,.4);
  return{key:k,gain(v){try{g.gain.setTargetAtTime(v,AC.currentTime,.05)}catch(e){logErr(e)}},stop(now){
    try{if(now){s.stop()}else{g.gain.setTargetAtTime(0,AC.currentTime,.4);s.stop(AC.currentTime+2.5)}}catch(e){logErr(e)}
  }};
}
function elStart(k){
  const r=SNDS['w:'+k];if(!r||r.bad)return null;
  if(r.a.paused)r.a.volume=0;
  const p=r.a.play();if(p&&p.catch)p.catch(()=>{});
  sndFade(r.a,SND.vol.amb);
  const h={key:k,gain(v){clearInterval(r.a._f);r.a.volume=Math.max(0,Math.min(1,v))},stop(now){
    if(now)r.a.pause();
    else sndFade(r.a,0,()=>{if(ambCur!==h)r.a.pause()});

  if(!(d.r>0)||!d.n||!d.n.en||!d.ico||typeof d.m!=='function')console.warn('[decor] 欄位不完整：'+d.k)});

const DEC=window.DEC=[],GIFTS=window.GIFTP=[];
const MIG={pond:'scarecrow',picnic:'beehive'};   // 舊版的平面裝飾品（小池塘、野餐墊）改成站得住的新裝飾品
const G=()=>{const g=S.g||(S.g={});g.pend=g.pend||[];g.decor=g.decor||[];g.rec=g.rec||[];g.gone=g.gone||{};
  g.decor.forEach(o=>{if(MIG[o.k]){o.k=MIG[o.k];o.u=Date.now()}});g.pend.forEach(p=>{if(p.k==='d'&&MIG[p.i]){p.i=MIG[p.i];p.u=Date.now()}});return g};
const gsave=()=>{persistState();try{window.cloud&&cloud.dirty()}catch(e){logErr(e)}};   // 存本機，同時通知雲端同步
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nameOf=k=>{const d=DBY[k];return d?I18N.pick(d.n):k};

function spawnDecor(o,anim){removeDecorObj(o.id);const g=buildDecor(o.k);g.position.set(o.x,gh(o.x,o.z),o.z);g.rotation.y=o.ry||0;g.userData.did=o.id;
  if(anim&&!S.rm){g.userData.pop=0;g.scale.setScalar(.001)}scene.add(g);DEC.push({id:o.id,k:o.k,x:o.x,z:o.z,r:DR[o.k],g})}
function removeDecorObj(id){slideDrop('dec:'+id);const i=DEC.findIndex(d=>d.id===id);if(i>=0){scene.remove(DEC[i].g);freeObj(DEC[i].g);DEC.splice(i,1)}}
function removeGiftObj(id){const j=GIFTS.findIndex(o=>o.id===id);if(j>=0){scene.remove(GIFTS[j].g);freeObj(GIFTS[j].g);GIFTS.splice(j,1)}}

/* 裝飾品能不能放在這裡：花園柵欄內、不擋橋頭通道與障礙物、不壓到花、別的裝飾品和還沒拆的禮物 */
function decorSpotOK(x,z,self,r){
  if(!(inG1(x,z,6.9-r*.3)||inG2(x,z,.84)))return false;
  if(Math.abs(z)<1.3+r*.4&&((x>4.9&&x<8)||(x>BB-.5&&x<BB+2)))return false;
  if(OBS.some(o=>Math.hypot(x-o[0],z-o[1])<o[2]+r*.5))return false;
  for(const d in flowers){const f=flowers[d];if(Math.hypot(f.position.x-x,f.position.z-z)<.4+r)return false}
  if(DEC.some(o=>o.id!==self&&Math.hypot(o.x-x,o.z-z)<o.r+r-.05))return false;
  if(GIFTS.some(o=>Math.hypot(o.to.x-x,o.to.z-z)<.45))return false;
  return true}
function findSpot(cx,cz,r,self){
  for(let i=0;i<70;i++){const a=Math.random()*6.283,rr=Math.sqrt(Math.random())*(1.2+i*.06),x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr;if(decorSpotOK(x,z,self,r))return[x,z]}
  for(let i=0;i<150;i++){const q=rndPt();if(decorSpotOK(q[0],q[1],self,r))return q}
  return null}
function putDecor(o,cx,cz){const r=DR[o.k],sp=findSpot(cx==null?tgG.x:cx,cz==null?tgG.z:cz,r,o.id);
  if(!sp){toast(tr('gNoSpot'));sfx('deny');return false}
  o.x=sp[0];o.z=sp[1];o.ry=Math.random()*6.283;o.p=1;o.nw=0;o.u=Date.now();spawnDecor(o,true);gsave();
  tgG.set(o.x,gh(o.x,o.z)+.3,o.z);if(radG>14)radG=12;sfx('decor_place','plant');burst('spark',{x:o.x,y:gh(o.x,o.z)+.3,z:o.z},6);toast(tr('gPlaced'));gbRefresh();return true}
function storeDecor(id){const o=G().decor.find(x=>x.id===id);if(!o)return;removeDecorObj(id);o.p=0;o.u=Date.now();gsave();sfx('move');toast(tr('gStored'));gbRefresh()}
/* 旋轉裝飾品：每按一次轉 45 度（帶緩動）；角度存在 ry，更新時間 u 一起更新，雲端逐項比較時較新的贏，所以會同步到其他裝置 */
function rotateDecor(id){const d=DEC.find(o=>o.id===id),s=G().decor.find(o=>o.id===id);if(!d||!s)return;const u=d.g.userData,TP=Math.PI*2;
  u.ryT=(u.ryT!=null?u.ryT:d.g.rotation.y)+Math.PI/4;if(S.rm)d.g.rotation.y=u.ryT;
  s.ry=((u.ryT%TP)+TP)%TP;s.u=Date.now();gsave();sfx('rotate','click')}
/* 把裝飾品轉到指定角度（走最短的路；其他裝置同步過來時也用這個） */
function setDecorRy(d,ry){const g=d.g,u=g.userData,TP=Math.PI*2,cur=u.ryT!=null?u.ryT:g.rotation.y;let df=(((ry-cur)%TP)+TP)%TP;if(df>Math.PI)df-=TP;u.ryT=cur+df;if(S.rm)g.rotation.y=u.ryT}

function dexGrid(){const own=DK.filter(k=>dxStat(k).all>0).length,pct=own/DK.length*100;
  const cards=DK.map(k=>{const s=dxStat(k),has=s.all>0;
    return `<button class="dx-c${has?'':' no'}" data-k="${k}" aria-label="${esc(has?nameOf(k):tr('gLocked'))}">${has&&dxFresh.has(k)?`<span class="dx-new">${esc(tr('gNew'))}</span>`:''}${has?`<span class="dx-x">×${s.all}</span>`:''}<span class="dx-n">No.${dxNo(k)}</span>${dIcon(k,52)}<span class="dx-t">${has?esc(nameOf(k)):'???'}</span><span class="dx-s">${has?`<span title="${esc(tr('gIn'))}">${ic('yard')} ${s.in}</span><span title="${esc(tr('gKept'))}">${ic('inventory_2')} ${s.kept}</span>`:esc(tr('gLocked'))}</span></button>`}).join('');
  gOpen(`<div class="dx-view"><div class="dx-hd"><h2 class="gsh-h">${ic('redeem')} ${esc(tr('gDex'))}</h2><div class="dx-sum"><span>${esc(tr('gDexSum',own,DK.length))}</span><div class="dx-bar"><i></i></div></div></div><div class="dx-body"><div class="dx-g">${cards}</div></div><div class="dx-ft"><button class="btn" id="gcl">${esc(tr('close'))}</button></div></div>`);
  const bd=$('gsh').querySelector('.dx-body');if(bd)bd.scrollTop=dxY;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const i=$('gsh').querySelector('.dx-bar i');if(i)i.style.width=pct+'%'}));
  $('gcl').onclick=gClose;
  $('gsh').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const bd=$('gsh').querySelector('.dx-body');dxY=bd?bd.scrollTop:0;dexDetail(b.dataset.k)})}
function dexDetail(k){const s=dxStat(k),has=s.all>0,nm=has?nameOf(k):'???';
  const body=has?`<div class="dx-st"><div><b>${s.in}</b><small>${esc(tr('gIn'))}</small></div><div><b>${s.kept}</b><small>${esc(tr('gKept'))}</small></div><div><b>${s.all}</b><small>${esc(tr('gTotal'))}</small></div></div><div class="dx-act"><button class="btn" id="dxs"${s.in?'':' disabled'}>${ic('inventory_2')} ${esc(tr('gStoreOne'))}</button><button class="btn p" id="dxp"${s.kept?'':' disabled'}>${ic('yard')} ${esc(tr('gPlaceNow'))}</button></div>`
    :`<p class="dx-lock">${esc(tr('gLockedHint'))}</p>`;
  gOpen(`<div class="dx-top"><button id="dxb" aria-label="${esc(tr('gBack'))}" title="${esc(tr('gBack'))}">${ic('arrow_back')}</button><span class="dx-n">No.${dxNo(k)}</span><button id="dxc" aria-label="${esc(tr('close'))}" title="${esc(tr('close'))}">${ic('close')}</button></div><div class="dx-d"><div class="dx-hero${has?'':' no'}">${dIcon(k,84)}</div><h2>${esc(nm)}</h2>${has?'':`<small>${esc(tr('gLocked'))}</small>`}${body}</div>`);
  $('dxb').onclick=()=>dexGrid();$('dxc').onclick=gClose;
  if(!has)return;
  $('dxs').onclick=()=>{const o=[...G().decor].reverse().find(x=>x.k===k&&x.p);if(!o)return;storeDecor(o.id);dexDetail(k)};
  $('dxp').onclick=()=>{const o=G().decor.find(x=>x.k===k&&!x.p);if(!o)return;if(putDecor(o))gClose()}}

function spawnGift(p,from){const g=new THREE.Group(),pal=['#F5C7D5','#B9D8EB','#F5DEA0','#D4C7EA','#B9D9C2'],c=pal[(parseInt(p.id.slice(-2),36)||0)%5];
  bx(g,BOXG,c,0,.09,0,.2,.16,.2);bx(g,BOXG,'#FFFFFF',0,.09,0,.215,.165,.04);bx(g,BOXG,'#FFFFFF',0,.09,0,.04,.165,.215);bx(g,SPH,'#FFFFFF',-.035,.2,0,.05,.032,.035);bx(g,SPH,'#FFFFFF',.035,.2,0,.05,.032,.035);
  const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:'#FFE9A8',blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:.4}));gl.scale.set(.75,.75,1);gl.position.y=.2;g.add(gl);
  const hb=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),new THREE.MeshBasicMaterial({visible:false}));hb.position.y=.15;hb.scale.setScalar(.38);hb.userData.gid=p.id;g.add(hb);
  const to={x:p.x,y:gh(p.x,p.z),z:p.z};g.position.set(from.x,from.y,from.z);g.scale.setScalar(.4);scene.add(g);
  GIFTS.push({id:p.id,g,gl,hb,from:{x:from.x,y:from.y+.2,z:from.z},to,t:S.rm?9:0,i:Math.random()*6})}
function pickGift(e){if(!GIFTS.length)return null;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(GIFTS.map(o=>o.hb),false)[0];return h?h.object.userData.gid:null}
function pickDecor(e){if(!DEC.length)return null;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(DEC.map(o=>o.g),true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.did)o=o.parent;return o?o.userData.did:null}
function openGift(gid){const g=G(),i=g.pend.findIndex(p=>p.id===gid);if(i<0)return;const p=g.pend[i];g.pend.splice(i,1);
  const j=GIFTS.findIndex(o=>o.id===gid);if(j>=0){const o=GIFTS[j],q={x:o.to.x,y:o.to.y+.2,z:o.to.z};burst('spark',q,6);burst('heart',q,3);scene.remove(o.g);GIFTS.splice(j,1)}

  /* ---- 登入 / 權杖 ---- */
  function signIn(){if(!client)return;manual=true;client.requestAccessToken({prompt:'select_account'})}
  function reauth(){if(!client)return;client.requestAccessToken({prompt:'',hint:user&&user.email})}
  function arm(){if(armed||!user)return;armed=true;addEventListener('click',()=>{armed=false;if(user&&!tokOK()&&!SLP.on)reauth()},{once:true,capture:true})}
  function signOut(){tok=null;user=null;api.user=null;persist();setSt('out');toast(tr('cOut'))}
  function wipeLocal(){try{GF.wipe()}catch(e){logErr(e)}for(const d in flowers)rmFlower(d);S.e={};S.del={};wClear();S.wdel={};for(const i in _wj)delete _wj[i];for(const d in _bj)delete _bj[d];S.wx=null;S.wxd=null;S.out=null;try{window.HOMEI&&HOMEI.refresh()}catch(e){logErr(e)}setWeather(null);try{syncCr()}catch(e){logErr(e)}}
  async function onTok(r){
    if(r.error){if(manual)toast(esc(tr('cFail')+' ('+r.error+')'));manual=false;return}
    if(!google.accounts.oauth2.hasGrantedAllScopes(r,DRIVE_SCOPE)){manual=false;toast(tr('cScope'));return}
    tok={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};
    try{const p=await(await gx('https://www.googleapis.com/oauth2/v3/userinfo')).json(),nu={sub:p.sub,email:p.email,name:p.name};

      lastVer=null;sync()}
    catch(e){tok=null;manual=false;setSt('err')}}

  /* ---- 同步：讀雲端檔 → 逐日比較更新時間（較新的贏）→ 必要時寫回 ---- */
  function applyE(d,o){o=JSON.parse(JSON.stringify(o));const old=S.e[d],f=flowers[d];
    /* 只有旋轉角度不同（其餘欄位都一樣）：不重建花朵，改成順著最短方向平滑轉過去，跟裝飾品的同步動畫一致 */
    const same=!!(old&&f&&f.userData&&(()=>{const ks=new Set([...Object.keys(old),...Object.keys(o)]);ks.delete('r');ks.delete('u');for(const k of ks)if(JSON.stringify(old[k])!==JSON.stringify(o[k]))return false;return true})());
    S.e[d]=o;_bj[d]=_sig(o);delete S.del[d];
    if(!ok)return;
    if(same){const u=f.userData,TP=Math.PI*2,cur=u.ryT!=null?u.ryT:f.rotation.y;let df=((((o.r||0)-cur)%TP)+TP)%TP;if(df>Math.PI)df-=TP;u.ryT=cur+df;if(S.rm)f.rotation.y=u.ryT}
    else{rmFlower(d);addFlower(d,1)}}
  function applyD(d,u){rmFlower(d);delete S.e[d];delete _bj[d];S.del[d]=u}
  async function sync(){
    if(!user)return;if(SLP.on){localDirty=true;return}if(busy){again=true;return}
    if(!tokOK()){setSt('reauth');arm();return}
    busy=true;const wasDirty=localDirty;localDirty=false;if(st!=='ok')setSt('syncing');
    try{
      const fs=await list();
      if(fs.length===1&&fs[0].version===lastVer&&!wasDirty){lastOk=Date.now();setSt('ok');busy=false;return}
      const R={e:{},del:{},w:{},wdel:{}};
      for(const f of fs){const j=await dl(f.id);for(const d in j.e||{})if(!(d in R.e)||ts(j.e[d])>ts(R.e[d]))R.e[d]=j.e[d];for(const d in j.del||{})R.del[d]=Math.max(R.del[d]||0,j.del[d]);if(j.g)R.g=GF.mrg(R.g,j.g);for(const d in j.w||{})if(!(d in R.w)||ts(j.w[d])>ts(R.w[d]))R.w[d]=j.w[d];for(const d in j.wdel||{})R.wdel[d]=Math.max(R.wdel[d]||0,j.wdel[d]);if(j.o&&(!R.o||(j.o.u||0)>(R.o.u||0)))R.o=j.o}
      const out={v:1,e:{},del:{},w:{},wdel:{}};let touched=false,dirty=fs.length>1;
      const dates=new Set([...Object.keys(S.e),...Object.keys(S.del),...Object.keys(R.e),...Object.keys(R.del)]);
      dates.forEach(d=>{
        const le=S.e[d],lts=le?ts(le):(S.del[d]||0),a=ts(R.e[d]),b=R.del[d]||0,rts=Math.max(a,b),rIsE=a>b;
        if(rts>lts){touched=true;if(rIsE){applyE(d,R.e[d]);out.e[d]=R.e[d]}else{applyD(d,b);out.del[d]=b}}
        else if(lts>rts){dirty=true;if(le){if(!le.u)le.u=le.pt||Date.now();out.e[d]=le}else if(rts>0)out.del[d]=lts}
        else if(rts>0){if(rIsE)out.e[d]=R.e[d];else out.del[d]=b}
        else if(le){le.u=Date.now();out.e[d]=le;dirty=true}});   // 沒有任何時間資訊的舊花：補上時間後上傳
      /* 星願島的花：跟逐日的花同樣的規則，逐朵比較更新時間（較新的贏），刪除也會同步 */
      {const ws=new Set([...Object.keys(S.w),...Object.keys(S.wdel),...Object.keys(R.w),...Object.keys(R.wdel)]);
        ws.forEach(id=>{const le=S.w[id],lts=le?ts(le):(S.wdel[id]||0),a=ts(R.w[id]),b=R.wdel[id]||0,rts=Math.max(a,b),rIsE=a>b;
          if(rts>lts){touched=true;if(rIsE){wApply(id,R.w[id]);out.w[id]=R.w[id]}else{wDrop(id,b);out.wdel[id]=b}}
          else if(lts>rts){dirty=true;if(le){if(!le.u)le.u=le.pt||Date.now();out.w[id]=le}else if(rts>0)out.wdel[id]=lts}
          else if(rts>0){if(rIsE)out.w[id]=R.w[id];else out.wdel[id]=b}
          else if(le){le.u=Date.now();out.w[id]=le;dirty=true}})}
      /* 出門狀態：只有一筆，比較更新時間，較新的贏 */
      {const lo=S.out,ro=R.o,lu=lo?lo.u||0:0,ru=ro?ro.u||0:0;
        if(ru>lu){touched=true;S.out=JSON.parse(JSON.stringify(ro));out.o=ro}
        else if(lu>ru){dirty=true;out.o=lo}
        else if(ro)out.o=ro}
      {const gr=GF.sync(R.g);if(gr.g)out.g=gr.g;if(gr.dirty)dirty=true;if(gr.touched)touched=true}   // 禮物與裝飾品
      if(dirty||!fs.length){const body=JSON.stringify(out),r=fs.length?await update(fs[0].id,body):await create(body);lastVer=r.version;
        for(const f of fs.slice(1))gx(D+'/'+f.id,{method:'DELETE'}).catch(()=>{})}
      else lastVer=fs[0].version;
      if(touched)afterApply();else save();
      lastOk=Date.now();setSt('ok')}
    catch(e){if(e.status===401){tok=null;persist();setSt('reauth');arm()}else setSt(navigator.onLine?'err':'offline')}
    busy=false;if(again){again=false;sync()}}
  function afterApply(){
    try{if(ok)syncCr()}catch(e){logErr(e)}
    try{window.SI&&SI.refresh()}catch(e){logErr(e)}
    try{window.HOMEI&&HOMEI.refresh()}catch(e){logErr(e)}
    const t=S.e[today()];if(t&&(S.wxd!==today()||S.wx!==t.mood)){S.wx=t.mood;S.wxd=today();setWeather(t.mood)}else if(!t&&!window.wxm&&!S.wxo){const w=curWx();if(w)setWeather(w)}

  api.sync=sync;api.wake=()=>{if(user)(tokOK()?sync():(setSt('reauth'),arm()))};

  /* ---- 啟動 ---- */
  function init(){

    document.head.append(s);

    document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!user)return;tokOK()?sync():(setSt('reauth'),arm())});
    addEventListener('online',()=>{if(user&&tokOK())sync()});addEventListener('offline',()=>{if(user)setSt('offline')})}
  init();
  return api})();
</script>
<script>
/* ===== 河流休息區 =====
   兩座花園之間的河從橋下流過，河中有一座小島（長椅、燈籠、垂柳、碼頭）。
   點小島 → 出現一片葉子形狀的輸入框 → 寫完按「放入河中」→ 葉子落在水面，順著河水漂過橋下、漂進遠方的霧裡。
   葉子上的字不會被儲存（也不會同步），放下就是放下。
   這個區塊獨立運作：沒有 WebGL 時整段跳過；不動花園、花朵、動物、天氣、同步等任何原有功能。 */

I18N.add('ko',{rvT:'강가의 쉼터',rvPh:'놓아주고 싶은 마음을 잎에 적어 보세요…',rvGo:'강에 띄우기',rvNote:'이 잎은 어디에도 저장되지 않아요. 아는 건 강물뿐이에요.',rvEmpty:'먼저 잎에 몇 글자 적어 주세요',rvDone:'강물이 살며시 데려가고 있어요',rvLeaf:['초록','노랑','분홍','라벤더']});
}catch(e){logErr(e)}

/* ---------- 河的形狀 ---------- */
const WY=-.55,RZ0=-200,RZ1=130,LZ=-70;                                  // 水面高度、河的起訖（z）
const far=z=>Math.min(1,Math.max(0,(Math.abs(z)-12)/25));      // 離花園越遠，河越能大幅彎曲、越寬
const cx=z=>10.35+.7*Math.sin(z*.19+.5)+far(z)*4.5*Math.sin(z*.032+.8),hw=z=>3.5+.5*Math.sin(z*.31+1.2)+Math.max(0,Math.abs(z)-18)*.04;   // 中心線 x、半寬

{
  const NZ=Math.round(RZ1-RZ0),NU=18,pos=[],nor=[],aR=[],idx=[];
  for(let i=0;i<=NZ;i++){const z=RZ0+(RZ1-RZ0)*i/NZ;for(let j=0;j<=NU;j++){const u=j/NU*2-1;pos.push(cx(z)+u*hw(z),WY,z);nor.push(0,1,0);aR.push(u,i/NZ)}}
  for(let i=0;i<NZ;i++)for(let j=0;j<NU;j++){const a=i*(NU+1)+j,b=a+1,c=a+NU+1,d=c+1;idx.push(a,c,b,b,c,d)}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('normal',new T.Float32BufferAttribute(nor,3));g.setAttribute('aR',new T.Float32BufferAttribute(aR,2));g.setIndex(idx);
  const FH=`#include <common>
uniform float uT,uDay,uNight;uniform vec4 uRip[8];uniform vec2 uG2;varying vec2 vR;varying vec3 vWp;
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){return .55*vn(p)+.3*vn(p*2.1+5.7)+.15*vn(p*4.3+1.9);}
float rho2g(float a){return 6.4*(1.+.14*sin(2.*a+.9)+.1*sin(3.*a+2.2)+.07*sin(5.*a+.4));}
float Hh(vec2 p){return fbm(vec2(p.x*1.5,p.y*.75+uT*.42))+.6*fbm(vec2(p.x*3.2,p.y*1.5+uT*.8)+9.);}`;
  const FC=`vec2 pp=vWp.xz;float e=.07;float h0=Hh(pp),hx=Hh(pp+vec2(e,0.)),hz=Hh(pp+vec2(0.,e));
vec2 g=vec2(h0-hx,h0-hz)/e*.055;float rg=0.;
for(int i=0;i<8;i++){vec4 r=uRip[i];if(r.w>0.){float d=length(pp-r.xy);float R=r.z*.55;float q=(d-R)*5.;float w=exp(-q*q)*(1.-r.z/3.5)*r.w;vec2 dir=(pp-r.xy)/max(d,.001);g+=dir*w*.35*cos((d-R)*14.);rg+=w;}}
vec3 wn=normalize(vec3(g.x,1.,g.y));
float au=abs(vR.x);
float d1=length(pp)-7.79;vec2 q2=pp-vec2(uG2.x,0.);float d2=length(q2)-rho2g(atan(q2.y,q2.x))*.971;float dw=min(d1,d2);
float shore=1.-smoothstep(0.,1.2,dw);

vec3 deep=vec3(.22,.46,.60),mid=vec3(.36,.62,.70),shal=vec3(.62,.80,.76);
vec3 col=mix(mid,deep,smoothstep(.2,1.,1.-au)*.75);col=mix(col,shal,shore*.75);

  const FE=`float sp=smoothstep(.9,1.,vn(pp*7.5+vec2(0.,uT*1.1)))*smoothstep(.55,.95,vn(pp*3.1-uT*.35));
totalEmissiveRadiance+=vec3(1.,.97,.88)*sp*(.28*uDay+.1)*edge*endF+vec3(.1,.2,.36)*uNight*(.35+st)*.5*edge;`;
  const wm=new T.MeshStandardMaterial({color:'#ffffff',roughness:.34,metalness:0,transparent:true,depthWrite:false,side:T.DoubleSide});

  const river=new T.Mesh(g,wm);river.frustumCulled=false;river.receiveShadow=false;river.castShadow=false;river.renderOrder=-1;scene.add(river);
}

/* ---------- 水波紋（落葉、漂流、下雨時用） ---------- */
let ripI=0;const rips=U.uRip.value;

const BOX=new T.BoxGeometry(1,1,1),ICO=new T.IcosahedronGeometry(1,0);
/* 沿用兩座花園的材質與貼圖（草地、土壤、木紋、樹皮、樹葉、石頭、屋瓦），小島才會跟花園是同一種風格 */
const K=window.SKIN||null;

const lm=new T.MeshStandardMaterial({color:'#FFE3B0',roughness:.5,emissive:new T.Color('#FFC77A'),emissiveIntensity:.2}),lampW=new T.Vector3(IX+IR*.78+1.4,.96,IZ-.1);
{
  const SG=56,KR=8,Rg=a=>IR*(1+.07*Math.sin(3*a+.6)+.042*Math.sin(5*a+1.7));
  {const c1=new T.Color('#98C281'),c2=new T.Color('#B8D890'),cc=new T.Color(),pos=[0,-.06,0],col=[],idx=[];
    const paint=(x,z,dirt)=>{const n=(Math.sin(x*.9)*Math.cos(z*1.1)+Math.sin(x*.3+z*.5))*.25+.5;cc.copy(c1).lerp(c2,clamp(n,0,1));if(dirt)cc.set('#C9A97E');col.push(cc.r,cc.g,cc.b)};
    paint(IX,IZ,false);
    for(let k=1;k<=KR;k++){const f=k/KR;for(let i=0;i<SG;i++){const a=i/SG*6.2832,r=Rg(a)*f,x=Math.cos(a)*r,z=Math.sin(a)*r;pos.push(x,k===KR?-.2:-.06-.1*f*f,z);paint(IX+x,IZ+z,f>.97)}}

    for(let k=0;k<KR-1;k++)for(let i=0;i<SG;i++){const a=1+k*SG+i,b=1+k*SG+(i+1)%SG,c=a+SG,d=b+SG;idx.push(a,b,c,b,d,c)}
    const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();

/* ---------- 位置、形狀與時間規則 ---------- */
const FAST=/[?&]wishfast=1/.test(location.search),
  WAIT_MS=FAST?20e3:2*36e5,          // 種下後多久可以澆水（約 2 小時）
  GROW2_MS=FAST?10e3:10*6e4,
  MIN_MS=FAST?6e4:3*36e5;              // 目標至少要在 3 小時之後（要留給「2 小時 + 10 分鐘」的成長時間）         // 澆水後多久長到第二階段（10 分鐘）
const SX=STAR.x,SZ=STAR.z,RW=STAR.R,ISY=.1,FR=.8;                       // 島的位置、半徑、離地高度；FR＝可以種花的範圍（柵欄內側）
const rho=a=>RW*(1+.09*Math.sin(2*a+1.1)+.07*Math.sin(3*a+.3)+.05*Math.sin(5*a+2.2));
const hh=(x,z)=>.05*Math.sin(x*1.2+.9)*Math.cos(z*1.05);                // 島上微微的起伏（相對於島）
const gy=(wx,wz)=>ISY+hh(wx-SX,wz-SZ);                                  // 世界座標的地面高度
const OBS=[[-1.35,-1.55,.65],[1.45,-1.5,.45]];                           // 許願石、星星燈柱（不能種花）
const stageOf=e=>{const n=Date.now();if(!e.wt)return 0;return n>=e.tt?2:(n-e.wt>=GROW2_MS)?1:0};   // 沒澆水就一直是幼苗；澆水後，到了實現時間（或已過）才盛開
const thirstyOf=e=>!e.wt&&Date.now()-e.pt>=WAIT_MS;
const waitLeft=e=>Math.max(0,e.pt+WAIT_MS-Date.now()),growLeft=e=>Math.max(0,Math.min(e.wt+GROW2_MS,Math.max(e.tt,e.wt))-Date.now());   // 澆水後：10 分鐘，或距離實現時間更近就等到那時
const wids=()=>Object.keys(S.w).filter(i=>S.w[i]&&!S.w[i].sh);
const wid=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDT=ms=>new Date(ms).toLocaleString(LC(),{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const dfmt=ms=>new Date(ms).toLocaleDateString(LC(),{year:'numeric',month:'short',day:'numeric'});
const leftTxt=ms=>{if(ms<=0)return tr('swArrived');const m=Math.ceil(ms/6e4);if(m<60)return tr('swInM',m);const h=Math.ceil(ms/36e5);if(h<48)return tr('swInH',h);return tr('swInD',Math.ceil(ms/864e5))};
const clip=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n)+'…':s};

/* 這個位置（島上座標）能不能放花：要在柵欄內側，避開石頭和燈柱，且離別朵花夠遠 */
function legal(x,z,self,gap){const r=Math.hypot(x,z),a=Math.atan2(z,x);
  if(r>rho(a)*FR)return false;
  if(OBS.some(o=>Math.hypot(x-o[0],z-o[1])<o[2]))return false;
  for(const id in S.w){if(id===self)continue;const e=S.w[id];if(!e||e.sh||e.x===undefined)continue;if(Math.hypot(e.x-x,e.z-z)<gap)return false}
  return true}
/* 找一個空位來種新花；找不到就回傳 null（＝島上滿了） */
function freeSpot(){const c=[];
  for(let k=0;k<44;k++){const a=k/44*6.2832;for(let f=.05;f<=1.001;f+=.06){const r=rho(a)*FR*f,x=Math.cos(a)*r,z=Math.sin(a)*r;if(legal(x,z,null,.85))c.push([x,z])}}
  if(!c.length)return null;const q=c[Math.floor(Math.random()*c.length)];return{x:q[0],z:q[1]}}

/* ---------- 小島本體 ---------- */
const isl=new T.Group();isl.position.set(SX,ISY,SZ);scene.add(isl);
const K=window.SKIN||null,sway=[];
const rock=m=>{if(K){m.geometry=K.RKG;m.material=K.SM(m.material,'rk',K.V(K.TS,'s',2,2),{roughness:.92,bumpScale:3})}return m};
const bark=m=>{if(K){m.geometry=K.TRUNK;m.material=K.SM(m.material,'bk',K.V(K.TB,'b',1,1),{roughness:.95,bumpScale:1.5})}return m};
/* 草地：偏藍綠的柔和草色，邊緣一圈泥土 */
{const KR=22,SG=72,c1=new T.Color('#8FC4A0'),c2=new T.Color('#B6DCA6'),cc=new T.Color(),pos=[0,hh(0,0),0],col=[],idx=[];
  const paint=(x,z,dirt)=>{const n=(Math.sin(x*.9)*Math.cos(z*1.1)+Math.sin(x*.3+z*.5))*.25+.5;cc.copy(c1).lerp(c2,clamp(n,0,1));if(dirt)cc.set('#C9A97E');col.push(cc.r,cc.g,cc.b)};
  paint(SX,SZ,false);
  for(let k=1;k<=KR;k++){const f=k/KR;for(let i=0;i<SG;i++){const a=i/SG*6.2832,r=rho(a)*f,x=Math.cos(a)*r,z=Math.sin(a)*r;pos.push(x,k===KR?-.2:hh(x,z)-.1*f*f,z);paint(SX+x,SZ+z,f>.97)}}
  for(let i=0;i<SG;i++)idx.push(0,1+(i+1)%SG,1+i);
  for(let k=0;k<KR-1;k++)for(let i=0;i<SG;i++){const a=1+k*SG+i,b=1+k*SG+(i+1)%SG,c=a+SG,d=b+SG;idx.push(a,b,c,b,d,c)}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
  const gm=new T.MeshStandardMaterial({color:'#ffffff',roughness:1,vertexColors:true});if(K)K.skinGround(gm);
  const gr=new T.Mesh(g,gm);gr.receiveShadow=true;isl.add(gr)}
/* 側壁與底部 */
{const SG=72,sp=[],si=[],uv=[];
  for(let i=0;i<SG;i++){const a=i/SG*6.2832,r=rho(a),x=Math.cos(a),z=Math.sin(a);sp.push(x*r*1.012,-.2,z*r*1.012,x*r*.85,-1.6,z*r*.85);uv.push(i/SG*3,1,i/SG*3,0)}
  for(let i=0;i<SG;i++){const j=(i+1)%SG;si.push(i*2,j*2,i*2+1,j*2,j*2+1,i*2+1)}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(sp,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(si);g.computeVertexNormals();
  let m=new T.MeshStandardMaterial({color:'#E3C9A8',roughness:.88,side:2,emissive:new T.Color('#E3C9A8').multiplyScalar(.13)});
  if(K)m=K.SM(m,'so',K.V(K.TSo,'o',1,1),{roughness:.95,bumpScale:1.5});
  const sk=new T.Mesh(g,m);sk.castShadow=true;isl.add(sk);
  const cp=[0,-1.75,0],ci=[];for(let i=0;i<SG;i++)cp.push(sp[i*6+3],sp[i*6+4],sp[i*6+5]);for(let i=0;i<SG;i++)ci.push(0,1+i,1+(i+1)%SG);
  const cg=new T.BufferGeometry();cg.setAttribute('position',new T.Float32BufferAttribute(cp,3));cg.setIndex(ci);cg.computeVertexNormals();isl.add(new T.Mesh(cg,new T.MeshStandardMaterial({color:'#D9BD98',roughness:.9,side:2})))}
/* 柵欄：跟花園同款的木柵欄，柱頭是微微發光的小球（夜裡像一圈小星星） */

        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      })
      .catch(() => {});
  });
}
</script>
<script>window.addEventListener('load',()=>{try{I18N.audit()}catch(e){logErr(e)}});</script>
