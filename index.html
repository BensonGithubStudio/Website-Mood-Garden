function renderSet(){$('p-set').innerHTML=`<h2>${tr('setT')}</h2><div class="row" style="flex-direction:column;align-items:flex-start"><span>${tr('lang')}</span><div class="tags" id="lg" style="margin:0">${[['en','English'],['zh','繁體中文'],['ja','日本語'],['ko','한국어']].map(([c,n])=>`<button class="tag" data-l="${c}" aria-pressed="${S.lang==c}">${n}</button>`).join('')}</div></div><div class="row" style="flex-direction:column;align-items:flex-start"><span>${tr('tmT')}<br><small>${tr('tmD')}</small></span><div class="tags" id="tm" style="margin:0">${[['auto',tr('tmA')],['day',tr('tmDay')],['night',tr('tmN')]].map(([c,n])=>`<button class="tag" data-m="${c}" aria-pressed="${(S.tm||'auto')==c}">${n}</button>`).join('')}</div></div><div class="row"><span>${tr('wxT')}<br><small>${tr('wxD')}</small></span><button class="btn" id="wxb" aria-pressed="${!S.wxo}">${S.wxo?tr('off'):tr('on')}</button></div><div class="row"><span>${tr('rmT')}<br><small>${tr('rmD')}</small></span><button class="btn" id="rm" aria-pressed="${S.rm}">${S.rm?tr('on'):tr('off')}</button></div><div class="row"><span>${tr('rsT')}<br><small>${tr('rsD')}</small></span><button class="btn r" id="rs">${tr('rsB')}</button></div><p style="font-size:13px;opacity:.7;margin-top:10px">${tr('local')}</p>`;
  $('lg').onclick=e=>{const b=e.target.closest('[data-l]');if(b){S.lang=b.dataset.l;save();applyLang()}};
  $('tm').onclick=e=>{const b=e.target.closest('[data-m]');if(b){S.tm=b.dataset.m;save();if(window.applyTime)applyTime();renderSet()}};
  $('rm').onclick=()=>{S.rm=!S.rm;save();renderSet()};
  $('wxb').onclick=()=>{S.wxo=!S.wxo;save();setWeather(S.wxd==today()?S.wx:null);renderSet()};
  $('rs').onclick=async()=>{if(await ask(tr('rs1'),tr('rs1y'))&&await ask(tr('rs2'),tr('rs2y'))){for(const d in flowers)scene.remove(flowers[d]);for(const d in flowers)delete flowers[d];S.e={};syncCr();S.wx=null;setWeather(null);save();show('garden');toast(tr('resetDone'))}}}
/* ---------- boot ---------- */
if(ok)ents().forEach(([d])=>addFlower(d,1));
$('obc').innerHTML=['happy','calm','loved','sad'].map(k=>`<span>${face(k,22)} ${M[k].n}</span>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-label',b.lastChild.textContent.trim()));
const closeOb=()=>{$('ob').hidden=true;S.ob=1;save()};
$('go').onclick=()=>{closeOb();openModal()};$('skip').onclick=closeOb;if(S.ob)$('ob').hidden=true;
applyLang();show('garden');window.pillReady=true;setWeather(S.wxd==today()?S.wx:null,true);if(window.applyTime){applyTime();setInterval(applyTime,30000)}
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then((reg) => {
        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      })
      .catch(() => {});
  });
}
</script>
