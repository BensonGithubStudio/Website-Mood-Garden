<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#F8F5EF;--pink:#F5C7D5;--yel:#F5DEA0;--mint:#B9D9C2;--sky:#B9D8EB;--lav:#D4C7EA;--ink:#5B5A55;--gl:rgba(255,252,247,.8);--sh:0 10px 30px rgba(120,100,90,.18)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:600 15px/1.45 Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#86B6DA,#B4D3E2 55%,#D6DDD0);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,.logo,.fab,.big{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,textarea:focus-visible{outline:3px solid #8DB9E8;outline-offset:2px}
.glass{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;box-shadow:var(--sh);border:1px solid #fff9}

.logo{font-size:22px;white-space:nowrap;background:var(--gl);padding:8px 16px;border-radius:99px;box-shadow:var(--sh)}
#date{white-space:nowrap;background:var(--gl);padding:8px 14px;border-radius:99px;font-size:13px}
.hello{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 72px);padding:16px 20px;max-width:310px}
.hello h1{font-size:19px;line-height:1.2}.hello p{margin:4px 0 10px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#fff;border-radius:99px;padding:3px 11px;font-size:12.5px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:#F29BB5;color:#fff;padding:15px 24px;border-radius:99px;font-size:17px;box-shadow:0 10px 24px #f29bb577;transition:transform .2s}
.fab:hover{transform:scale(1.05) rotate(-1deg)}
nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--gl);backdrop-filter:blur(14px);box-shadow:var(--sh)}
nav button{padding:9px 16px;border-radius:99px;font-size:14px}
nav button{position:relative;z-index:1}
#pill{position:absolute;z-index:0;top:6px;bottom:6px;left:0;width:0;border-radius:99px;background:var(--pink);box-shadow:0 3px 10px #f29bb544;transition:transform .45s cubic-bezier(.34,1.4,.5,1),width .35s}
@media(prefers-reduced-motion:reduce){#pill{transition:none}}
@media(min-width:1000px){nav{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}.fab{bottom:28px}}
@media(max-width:759px){.hello{right:16px;max-width:none}.hello p{display:none}.fab{right:16px}}
@media(max-width:480px){.logo{font-size:17px;padding:6px 12px}#date{font-size:12px;padding:6px 11px}}
body:not([data-v=garden]) .g{display:none}
.panel{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-48%);width:min(520px,calc(100% - 28px));max-height:calc(100% - 170px);overflow:auto;padding:22px}
@media(min-width:1000px){.panel{top:calc(50% + 28px)}}
.panel h2{font-size:24px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .w{font-size:12px;opacity:.6}
.d{aspect-ratio:1;border-radius:16px;background:#ffffff88;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.d i{font-style:normal;font-size:20px;margin-top:2px}
.d.e i{width:12px;height:12px;border-radius:50% 50% 50% 0;background:#ddd3c4;opacity:.7;margin-top:5px}
.d.t{outline:3px solid var(--yel)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh button{background:#fff;width:34px;height:34px;border-radius:50%}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bar b{flex:0 0 78px;font-weight:700}
.bar div{height:16px;border-radius:99px;transition:width .6s}
.wk{display:flex;gap:6px;justify-content:space-between;margin-top:6px}
.wk div{flex:1;text-align:center;font-size:11px}.wk i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-style:normal;font-size:18px;background:#fff9;margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px dashed #d9cfbe}
.btn{background:#fff;padding:9px 16px;border-radius:99px;box-shadow:0 3px 10px #0001}.btn.p{background:#F29BB5;color:#fff}.btn.r{color:#b5484f}
.scrim{position:fixed;inset:0;z-index:20;background:#5b5a5555;display:grid;place-items:center;padding:14px}
.scrim[hidden],[hidden]{display:none!important}
.sheet{background:#FFFCF7;border-radius:32px;padding:22px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:var(--sh)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.mc{border-radius:24px;padding:12px 4px;background:#fff;border:3px solid transparent;text-align:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mc b{display:block;font-size:34px;line-height:1.2}.mc span{font-size:13px}.mc small{display:block;font-size:11px;opacity:.7}
.mc:hover{transform:translateY(-3px)}.mc[aria-pressed=true]{transform:scale(1.07) rotate(-2deg);border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,#fff)}
textarea{width:100%;border:2px solid #eadfcd;border-radius:18px;padding:10px 14px;font:inherit;color:inherit;background:#fff;resize:none;height:76px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.tag{background:#fff;padding:5px 13px;border-radius:99px;border:2px solid #eadfcd;font-size:13px}.tag[aria-pressed=true]{background:var(--lav);border-color:#b7a2e0}
#card{position:fixed;z-index:6;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(310px,calc(100% - 32px));background:#FFFBF0;padding:18px 20px;border-radius:6px 22px 6px 22px;transform:rotate(1.2deg);box-shadow:var(--sh);border:2px dashed #e7d9b9}
@media(min-width:1000px){#card{bottom:90px}}
#card h2{font-size:21px}#card p{margin:8px 0;font-style:italic}
.toast{position:fixed;z-index:30;left:50%;top:22%;transform:translateX(-50%);background:#fffc;padding:12px 22px;border-radius:99px;box-shadow:var(--sh);font-family:Fredoka;font-size:19px;animation:tw 3.6s forwards}
@keyframes tw{0%{opacity:0;top:26%}12%,80%{opacity:1;top:22%}100%{opacity:0}}
#fb{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-size:17px}
#ob{position:fixed;inset:0;z-index:40;background:linear-gradient(#9FCBEA,#D6ECF4 45%,#BFE0A8 46%,#A6D58F);overflow:hidden}
.cl{position:absolute;background:#fff;border-radius:99px;box-shadow:inset 0 -8px 14px #cde4f2;width:130px;height:46px}
.bud{position:absolute;left:50%;top:15%;width:min(240px,60vw);aspect-ratio:1;transform:translateX(-50%);animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-10px) rotate(2deg)}}
.bud .hd{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE6EE,#F5C7D5 70%);box-shadow:inset -10px -14px 24px #e9a0b955,0 16px 30px #0002}
.bud .hd:before,.bud .hd:after{content:"";position:absolute;top:44%;width:9%;height:11%;border-radius:50%;background:#5b3a3a}
.bud .hd:before{left:30%}.bud .hd:after{right:30%}
.bud .sm{position:absolute;left:41%;top:55%;width:18%;height:9%;border-bottom:5px solid #5b3a3a;border-radius:0 0 50% 50%}
.bud .ck{position:absolute;top:56%;width:13%;height:9%;border-radius:50%;background:#f29bb588}
.bud .st{position:absolute;left:47%;top:96%;width:6%;height:120%;background:#9CCB8A;border-radius:99px}
.ob-s{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;padding:26px 24px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:12px;justify-items:center;text-align:center}
.ob-s h1{font-size:30px;line-height:1.1}

@media(prefers-reduced-motion:reduce){.bud,.toast{animation:none}.toast{opacity:1}}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;font-size:1.3em;line-height:1;display:inline-block;vertical-align:-.25em;white-space:nowrap;font-variation-settings:'FILL' 1}
nav button{display:flex;align-items:center;gap:5px}
.logo{display:flex;align-items:center;gap:6px}.logo .ms{color:#F29BB5}
.chips span{display:inline-flex;align-items:center;gap:4px}
.hello h1{display:flex;align-items:center;gap:6px}.hello h1 .ms,.toast .ms{color:#F29BB5}
.toast{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:4px}
.mh button{display:grid;place-items:center}
.mc b svg{display:block;margin:0 auto}.mc small svg{vertical-align:-3px}
.d i svg,.wk i svg{display:block}
.bar b{display:flex;align-items:center;gap:4px;flex:0 0 100px}
nav{max-width:calc(100% - 16px)}
#card>div:last-child{flex-wrap:wrap}#card .btn{padding:8px 12px;font-size:14px}

const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,rm=S.rm,k=rm?1:1-Math.pow(.003,dt);
  tg.lerp(tgG,k);rad+=(radG-rad)*k;cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);
  for(const d in flowers){const f=flowers[d],u=f.userData;if(!rm){f.rotation.z=Math.sin(t*1.3+u.ph)*.035;u.h.rotation.z=Math.sin(t*1.7+u.ph)*.05}
    if(!P||P.d!==d){const s=u.base*(hover===d?1.12:1);f.scale.x+=(s-f.scale.x)*.15;f.scale.y+=(s-f.scale.y)*.15;f.scale.z=f.scale.x}}
  if(!rm){cl.forEach(c=>{c.position.x+=dt*c.userData.s;if(c.position.x>30)c.position.x=-30});
    bf.forEach(b=>{const u=b.userData,s=u.bee?.7:.28,a=t*s+u.i*2,x=Math.cos(a)*5.2*(u.bee?.8:1),z=Math.sin(a*1.3)*4.4,y=(u.bee?1:1.5)+Math.sin(t*1.1+u.i)*.35;b.position.set(x,y,z);b.rotation.y=-Math.atan2(-Math.sin(a*1.3)*1.3*4.4,-Math.sin(a)*5.2)+Math.PI/2;if(!u.bee){const w=Math.sin(t*16+u.i)*.9;u.w[0].rotation.z=w;u.w[1].rotation.z=-w}})}
  if(P){P.t+=rm?dt*8:dt;const f=flowers[P.d];setGrow(f,Math.min(1,(P.t-1.2)/3));
    P.seed.visible=P.t<1.1;P.seed.position.y=Math.max(.05,2-P.t*2.2)+f.position.y;
    if(sparkle){const a=sparkle.geometry.attributes.position;for(let i=0;i<a.count;i++)a.setY(i,a.getY(i)+dt*.4);a.needsUpdate=true;sparkle.material.opacity=Math.max(0,Math.min(1,(P.t-.9)*2,(5-P.t)))}
    if(P.t>3.9&&!P.toast){P.toast=1;toast(tr('bloomed'))}
    if(P.t>5){scene.remove(P.seed,P.hole,sparkle);sparkle=null;setGrow(f,1);P=null;radG=innerWidth<760?17:13;tgG.set(0,.4,0)}}
  if(ok)R.render(scene,cam)}
if(ok)frame();

/* ---------- camera input ---------- */
const cv=$('c'),pts=new Map(),ray=new THREE.Raycaster(),mv=new THREE.Vector2();let pd=0,moved=0,pinch=0;
function pick(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(Object.values(flowers),true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.date)o=o.parent;return o?o.userData.date:null}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);moved=0;if(pts.size==2){const[a,b]=[...pts.values()];pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);
  if(!p){const d=pick(e);hover=d;cv.style.cursor=d?'pointer':'grab';return}
  if(pts.size==2){pts.set(e.pointerId,e);const[a,b]=[...pts.values()],n=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);radG=Math.min(22,Math.max(4.5,radG*pinch/n));pinch=n;moved=99;return}
  const dx=e.clientX-p.clientX,dy=e.clientY-p.clientY;moved+=Math.abs(dx)+Math.abs(dy);th-=dx*.006;ph=Math.min(1.4,Math.max(.35,ph-dy*.005));pts.set(e.pointerId,e)});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(moved<6&&!pts.size){const d=pick(e);if(d)detail(d);else $('card').hidden=true}});
cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();radG=Math.min(22,Math.max(4.5,radG*(1+e.deltaY*.001)))},{passive:false});

/* ---------- UI ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.innerHTML=ic('local_florist')+' '+m;document.body.append(t);setTimeout(()=>t.remove(),3700)}
function ask(msg,yes){return new Promise(r=>{$('dm').textContent=msg;$('dy').textContent=yes||tr('confirm');$('dlg').hidden=false;$('dy').onclick=()=>{$('dlg').hidden=true;r(1)};$('dn').onclick=()=>{$('dlg').hidden=true;r(0)}})}
function movePill(anim){const b=document.querySelector('nav button[aria-current=true]'),p=$('pill');if(!b)return;p.style.transition=anim?'':'none';p.style.width=b.offsetWidth+'px';p.style.transform='translateX('+b.offsetLeft+'px)'}
addEventListener('resize',()=>movePill(false));if(document.fonts)document.fonts.ready.then(()=>movePill(false));
function show(v){document.body.dataset.v=v;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v==v));movePill(window.pillReady);['cal','ins','set'].forEach(x=>$('p-'+x).hidden=x!=v);$('card').hidden=true;if(v=='cal')renderCal();if(v=='ins')renderIns();if(v=='set')renderSet();if(v=='garden')refresh()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function refresh(){const n=new Date(),mk=dk(n).slice(0,7),en=ents(),mo=en.filter(([d])=>d.startsWith(mk)),c={};mo.forEach(([,e])=>c[e.mood]=(c[e.mood]||0)+1);
  $('date').textContent=n.toLocaleDateString(LC(),{weekday:'short',month:'short',day:'numeric'});
  $('hi').innerHTML=ic('local_florist')+(S.e[today()]?tr('hi1'):tr('hi0'));
  $('cnt').innerHTML=ic('eco')+' '+tr('cnt',en.length);
  $('mon').innerHTML=mo.length?tr('mon')+' '+Object.entries(c).map(([k,v])=>flo(k,18)+'×'+v).join(' '):tr('monNone');
  $('fab').hidden=!!S.e[today()];$('fab').innerHTML=ic('local_florist')+' '+tr('rec')}
function detail(d){const e=S.e[d];if(!e)return;show('garden');const f=flowers[d];if(f){tgG.set(f.position.x,f.position.y+.8,f.position.z);radG=5}
  const m=M[e.mood],c=$('card');c.hidden=false;
  c.innerHTML=`<div style="font-size:12px;opacity:.7">${fmt(d)}</div><h2 style="display:flex;align-items:center;gap:8px">${flo(e.mood,36)}<span>${m.f}</span></h2><div style="display:flex;align-items:center;gap:6px">${face(e.mood,24)} ${m.n}</div>${e.text?`<p>“${esc(e.text)}”</p>`:'<p style="opacity:.6">'+tr('noNote')+'</p>'}<div class="chips">${(e.tags||[]).map(t=>`<span>${esc(tr('tg')[TAGS.indexOf(t)]||t)}</span>`).join('')}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="ce">${ic('edit')} ${tr('edit')}</button><button class="btn r" id="cd">${ic('delete')} ${tr('delete')}</button><button class="btn" id="cx" style="margin-left:auto">${ic('close')} ${tr('close')}</button></div>`;
  $('ce').onclick=()=>openModal(d);$('cx').onclick=()=>{c.hidden=true;tgG.set(0,.4,0);radG=innerWidth<760?17:13};
  $('cd').onclick=async()=>{if(await ask(tr('delQ'),tr('delete'))){if(flowers[d]){scene.remove(flowers[d]);delete flowers[d]}delete S.e[d];save();c.hidden=true;tgG.set(0,.4,0);radG=innerWidth<760?17:13;refresh();toast(tr('removed'))}}}
let ed,sel,tg2=[];
function openModal(d){ed=d||today();const e=S.e[ed];sel=e?e.mood:null;tg2=e?[...(e.tags||[])]:[];
  $('mt').textContent=e?tr('editT',ed==today()?'':fmt(ed)):tr('hi0');$('ms').textContent=e?tr('save'):tr('plant');$('txt').value=e?e.text||'':'';
  $('moods').innerHTML=Object.entries(M).map(([k,m])=>`<button class="mc" data-k="${k}" style="--c:${m.c}" aria-pressed="${k==sel}"><b>${face(k,56)}</b><span>${m.n}</span><small>${flo(k,16)} ${m.f}</small></button>`).join('');
  $('tags').innerHTML=TAGS.map(t=>`<button class="tag" data-v="${t}" aria-pressed="${tg2.includes(t)}">${tr('tg')[TAGS.indexOf(t)]}</button>`).join('');
  $('moods').onclick=ev=>{const b=ev.target.closest('.mc');if(!b)return;sel=b.dataset.k;$('moods').querySelectorAll('.mc').forEach(x=>x.setAttribute('aria-pressed',x==b))};
  $('tags').onclick=ev=>{const b=ev.target.closest('.tag');if(!b)return;const t=b.dataset.v,i=tg2.indexOf(t);i<0?tg2.push(t):tg2.splice(i,1);b.setAttribute('aria-pressed',i<0)};
  $('modal').hidden=false}
$('fab').onclick=()=>openModal();$('mx').onclick=()=>$('modal').hidden=true;
$('ms').onclick=()=>{if(!sel){toast(tr('pick'));return}
  const e=S.e[ed],isNew=!e;S.e[ed]={...(e||{}),mood:sel,text:$('txt').value.trim(),tags:tg2};save();$('modal').hidden=true;$('card').hidden=true;show('garden');
  if(isNew){if(!ok){toast(tr('saved'));return}addFlower(ed,0);const f=flowers[ed],hole=mk(CYL,'#7A5A3A',[f.position.x,f.position.y+.01,f.position.z],[.3,.02,.3]),seed=mk(SPH,'#5B4A3A',[f.position.x,3,f.position.z],[.07,.09,.07]);scene.add(hole,seed);
    const n=30,ar=new Float32Array(n*3);for(let i=0;i<n;i++){ar[i*3]=f.position.x+(Math.random()-.5)*1.4;ar[i*3+1]=f.position.y+Math.random()*1.8;ar[i*3+2]=f.position.z+(Math.random()-.5)*1.4}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(ar,3));sparkle=new THREE.Points(g,new THREE.PointsMaterial({color:'#FFE9A0',size:.14,transparent:true,opacity:0,depthWrite:false}));scene.add(sparkle);
    P={d:ed,t:0,seed,hole};tgG.set(f.position.x,f.position.y+.6,f.position.z);radG=6;
  }else{const o=flowers[ed];if(o){scene.remove(o);delete flowers[ed]}addFlower(ed,1);toast(tr('updated'))}
  refresh()};
let cm=new Date();cm.setDate(1);
function renderCal(){const y=cm.getFullYear(),m=cm.getMonth(),first=cm.getDay(),n=new Date(y,m+1,0).getDate(),t=today();
  let h=`<div class="mh"><button id="pv" aria-label="Previous month">${ic('chevron_left')}</button><h2 style="margin:0">${cm.toLocaleDateString(LC(),{month:'long',year:'numeric'})}</h2><button id="nx" aria-label="Next month">${ic('chevron_right')}</button></div><div class="cal">`+tr('wd').map(x=>`<div class="w">${x}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){const k=dk(new Date(y,m,d)),e=S.e[k];h+=`<button class="d ${e?'':'e'} ${k==t?'t':''}" data-k="${k}" aria-label="${k}">${d}<i>${e?flo(e.mood,24):''}</i></button>`}
  $('p-cal').innerHTML=h+'</div><p style="margin-top:12px;font-size:13px;opacity:.75">'+tr('calNote')+'</p>';
  $('pv').onclick=()=>{cm.setMonth(m-1);renderCal()};$('nx').onclick=()=>{cm.setMonth(m+1);renderCal()};
  $('p-cal').querySelectorAll('.d').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(S.e[k])detail(k);else if(k==t){show('garden');openModal()}else toast(tr('calHint'))})}
function renderIns(){const en=ents(),mk=today().slice(0,7),mo=en.filter(([d])=>d.startsWith(mk)),c={};mo.forEach(([,e])=>c[e.mood]=(c[e.mood]||0)+1);
  if(!en.length){$('p-ins').innerHTML='<h2>'+tr('n_ins')+'</h2><p>'+tr('insEmpty')+'</p>';return}
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0],mx=Math.max(1,...Object.values(c));
  let h=`<h2>${tr('insM')}</h2><p>${top?tr('common',flo(top[0],20)+' '+M[top[0]].n,Math.round(top[1]/mo.length*100),mo.length):tr('insNone')}</p>`;
  h+=Object.entries(M).map(([k,m])=>{const v=c[k]||0;return`<div class="bar"><b>${flo(k,20)} ${m.n}</b><div style="width:${v/mx*55+3}%;background:${m.c}"></div><span>${v}</span></div>`}).join('');
  h+='<h2 style="margin-top:18px">'+tr('l7')+'</h2><div class="wk">';
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d),e=S.e[k];h+=`<div><i style="${e?'background:'+M[e.mood].c+'55':''}">${e?face(e.mood,28):''}</i>${d.toLocaleDateString(LC(),{weekday:'short'})}</div>`}
  $('p-ins').innerHTML=h+`</div><p style="margin-top:16px">${ic('eco')} ${tr('total',en.length)}</p>`}
function renderSet(){$('p-set').innerHTML=`<h2>${tr('setT')}</h2><div class="row" style="flex-direction:column;align-items:flex-start"><span>${tr('lang')}</span><div class="tags" id="lg" style="margin:0">${[['en','English'],['zh','繁體中文'],['ja','日本語'],['ko','한국어']].map(([c,n])=>`<button class="tag" data-l="${c}" aria-pressed="${S.lang==c}">${n}</button>`).join('')}</div></div><div class="row"><span>${tr('rmT')}<br><small>${tr('rmD')}</small></span><button class="btn" id="rm" aria-pressed="${S.rm}">${S.rm?tr('on'):tr('off')}</button></div><div class="row"><span>${tr('rsT')}<br><small>${tr('rsD')}</small></span><button class="btn r" id="rs">${tr('rsB')}</button></div><p style="font-size:13px;opacity:.7;margin-top:10px">${tr('local')}</p>`;
  $('lg').onclick=e=>{const b=e.target.closest('[data-l]');if(b){S.lang=b.dataset.l;save();applyLang()}};
  $('rm').onclick=()=>{S.rm=!S.rm;save();renderSet()};
  $('rs').onclick=async()=>{if(await ask(tr('rs1'),tr('rs1y'))&&await ask(tr('rs2'),tr('rs2y'))){for(const d in flowers)scene.remove(flowers[d]);for(const d in flowers)delete flowers[d];S.e={};save();show('garden');toast(tr('resetDone'))}}}
/* ---------- boot ---------- */
if(ok)ents().forEach(([d])=>addFlower(d,1));
$('obc').innerHTML=['happy','calm','loved','sad'].map(k=>`<span>${face(k,22)} ${M[k].n}</span>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-label',b.lastChild.textContent.trim()));
const closeOb=()=>{$('ob').hidden=true;S.ob=1;save()};
$('go').onclick=()=>{closeOb();openModal()};$('skip').onclick=closeOb;if(S.ob)$('ob').hidden=true;
applyLang();show('garden');window.pillReady=true;
</script></body></html>
