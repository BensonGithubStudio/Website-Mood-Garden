<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== 音效系統 =====
   進站時先預載全部音檔（見載入畫面）。檔案不存在或無法解碼時不播放、不報錯，
   只在主控台印出 [audio] 警告，方便找出是哪個檔案有問題。 */
const SND={
  vol:{sfx:.7,amb:.35},
  sfx:{
    click:'audio/sfx/click.wav',animal:'audio/sfx/animal.wav',flower:'audio/sfx/flower.wav',
    plant:'audio/sfx/plant.wav',water:'audio/sfx/water.wav',gift_drop:'audio/sfx/gift_drop.wav',gift_open:'audio/sfx/gift_open.wav',decor_place:'audio/sfx/decor_place.wav',delete:'audio/sfx/delete.wav',bloom:'audio/sfx/bloom.wav',move:'audio/sfx/move.wav',deny:'audio/sfx/deny.wav',
    animal_bee:'audio/sfx/animal_bee.wav',animal_bird:'audio/sfx/animal_bird.wav',animal_ladybug:'audio/sfx/animal_ladybug.wav',
    animal_butterfly:'audio/sfx/animal_butterfly.wav',animal_snail:'audio/sfx/animal_snail.wav',animal_frog:'audio/sfx/animal_frog.wav'
  },
  weather:{
    happy:'audio/weather/fresh-breeze.wav',excited:'audio/weather/rainbow.wav',calm:'audio/weather/breezy.wav',
    loved:'audio/weather/petal-rain.wav',sad:'audio/weather/light-rain.wav',anxious:'audio/weather/clouds-wind.wav'
  }
};
const SNDS={},SB={},RAW={},WB={};
let AC=null,sndUnlocked=false,ambKey=null,ambCur=null,ambTok=0;
const sfxOn=()=>{try{return S.snd!==false}catch(e){return true}};
const ambOn=()=>{try{return S.amb!==false}catch(e){return true}};
function sndVolSync(){try{SND.vol.sfx=(S.vs==null?70:S.vs)/100;SND.vol.amb=(S.va==null?35:S.va)/100}catch(e){}}   /* 把設定裡的音量滑桿值（0–100）同步到播放用的音量 */
function acx(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended'&&sndUnlocked)AC.resume();
    return AC;
  }catch(e){return null}
}
/* 預載：音效解碼成 AudioBuffer，背景音先存原始資料（用到時才解碼，省記憶體） */
function sndPreload(onTick){
  const items=[];
  for(const k in SND.sfx)items.push(['s',k,SND.sfx[k]]);

en:[
'The wind feels so nice today. How has your day been?',
'I just found a new flower in the garden and wanted to share it with you!',
'Secret: the sun is warm today. A perfect time for a little daydream.',
'Have you had some water? Take good care of yourself.',
'I lay on a petal for a while, and the whole world slowed down.',
'No matter how today goes, the garden will be here waiting for you.',
'One cloud looked just like a marshmallow. Did you see it?',
'Have you eaten something yummy today?',
'This little garden is so pretty because of you.',
'Take a deep breath, then let it out slowly. I\'m right here with you.',
'I walked a long way today and finally made it back here to rest.',
'If you\'re tired today, it\'s okay to go a little slower.',
'I heard the flowers whispering. I think they said your name.',
'The little grass is working hard to grow tall today. So are you!',

'Anything small and happy today? I\'d love to hear it.',

'The stars tonight will be peeking at your garden, I just know it.',

'Have you been gentle with yourself today?',
'I made a lap around the garden. Everyone is safe and sound!',
'The air smells so fresh. Maybe take a little walk outside?',
'I learned something new today: daydreaming counts as resting.',
'Thank you for visiting us every day. It makes us so happy.',
'If you\'re feeling down, I can sit quietly beside you for a while.',
'I hid under the flowers for a bit. It was cool and so comfy.',
'You\'ve already done well today.',
'A whisper: my favorite thing is the morning dew. It sparkles!',
'Take a peek at the sky if you can. The clouds are out for a stroll.',
'I chased a petal and ended up right here in your garden.',
'Before bed, turn down a little noise so your heart can rest too.',
'Every flower here has its own little temper, but they\'re all adorable.',
'Did anyone smile at you today? If not, I\'ll smile first.',
'I spotted the shadow of a rainbow by the fence. Maybe it came for you.',
'Sometimes doing nothing at all is a wonderful choice.',
'I\'m sharing a bit of my good mood with you.',
'I remember every flower you\'ve planted.',

'Listen quietly. Can you hear the wind brushing the petals?',

'If something is worrying you, leave it in the garden. We\'ll watch over it.',
'I found a very cozy corner. I\'ll show you next time.',

/* 裝飾品能不能放在這裡：花園柵欄內、不擋橋頭通道與障礙物、不壓到花、別的裝飾品和還沒拆的禮物 */
function decorSpotOK(x,z,self,r){
  if(!(inG1(x,z,6.9-r*.3)||inG2(x,z,.84)))return false;
  if(Math.abs(z)<1.3+r*.4&&((x>4.9&&x<8)||(x>BB-.5&&x<BB+2)))return false;
  if(OBS.some(o=>Math.hypot(x-o[0],z-o[1])<o[2]+r*.5))return false;
  for(const d in flowers){const f=flowers[d];if(Math.hypot(f.position.x-x,f.position.z-z)<.4+r)return false}
  if(DEC.some(o=>o.id!==self&&Math.hypot(o.x-x,o.z-z)<o.r+r-.05))return false;
  if(GIFTS.some(o=>Math.hypot(o.to.x-x,o.to.z-z)<.45))return false;
  return true}
function findSpot(cx,cz,r,self){
  for(let i=0;i<70;i++){const a=Math.random()*6.283,rr=Math.sqrt(Math.random())*(1.2+i*.06),x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr;if(decorSpotOK(x,z,self,r))return[x,z]}
  for(let i=0;i<150;i++){const q=rndPt();if(decorSpotOK(q[0],q[1],self,r))return q}
  return null}
function putDecor(o,cx,cz){const r=DR[o.k],sp=findSpot(cx==null?tgG.x:cx,cz==null?tgG.z:cz,r,o.id);
  if(!sp){toast(tr('gNoSpot'));sfx('deny');return false}
  o.x=sp[0];o.z=sp[1];o.ry=Math.random()*6.283;o.p=1;o.nw=0;o.u=Date.now();spawnDecor(o,true);gsave();
  tgG.set(o.x,gh(o.x,o.z)+.3,o.z);if(radG>14)radG=12;sfx('decor_place','plant');burst('spark',{x:o.x,y:gh(o.x,o.z)+.3,z:o.z},6);toast(tr('gPlaced'));gbRefresh();return true}
function storeDecor(id){const o=G().decor.find(x=>x.id===id);if(!o)return;removeDecorObj(id);o.p=0;o.u=Date.now();gsave();sfx('move');toast(tr('gStored'));gbRefresh()}

 if(Math.abs(z)<1.2&&((x>4.8&&x<8.4)||(x>BB-.7&&x<BB+2.2)))continue;if(OBS.some(q=>Math.hypot(x-q[0],z-q[1])<q[2]+.12))continue;if(Object.values(flowers).some(f=>Math.hypot(f.position.x-x,f.position.z-z)<.8))continue;
 const s=.22+rnd()*.2;o3.position.set(x,gh(x,z)-.02,z);o3.rotation.set(0,rnd()*3.14,0);o3.scale.set(s*1.5,s,s*1.5);o3.updateMatrix();TF.setMatrixAt(n,o3.matrix);TF.setColorAt(n,cq.copy(c1).lerp(c2,rnd()).multiplyScalar(.85+rnd()*.25));n++}
TF.count=n;TF.frustumCulled=false;TF.castShadow=false;TF.receiveShadow=true;scene.add(TF);
/* --- 編譯檢查：萬一 shader 在某些裝置失敗，退回原本的地面／草叢，場景不會壞 --- */
const gl=R.getContext(),chk=m=>{try{const p=R.properties.get(m).currentProgram;return!p||gl.getProgramParameter(p.program,gl.LINK_STATUS)}catch(e){return true}};
R.compile(scene,cam);
[...GR2,tm].forEach(m=>{if(!chk(m)){console.warn('texture shader fallback');m.onBeforeCompile=()=>{};m.customProgramCacheKey=()=>'x0';m.needsUpdate=true}});
/* --- 每幀同步：濕度、風、日夜對倒影的影響 --- */
(function lp(t){requestAnimationFrame(lp);try{const w=WX.wet||0,d=window.dfv==null?1:window.dfv;U.uWet.value=w;U.uT.value=S.rm?0:t/1000;U.uW.value=S.rm?0:.5+WX.wind*1.1;PW.forEach(m=>m.envMapIntensity=.12+1.5*d);GLm.forEach(m=>m.envMapIntensity=.1+.9*d);tm.color.setScalar(1-.16*w)}catch(e){}})(0);
}catch(e){console.warn('skin layer skipped',e)}
})();
</script>
<script>
/* ===== 雲端同步（Google 登入 + 使用者自己的 Google 雲端硬碟「應用程式資料夾」）=====
   花園會存成使用者雲端硬碟裡一個隱藏檔 garden.json：只有這個網站能讀寫，使用者在雲端硬碟介面看不到，
   開發者（你）也完全看不到任何人的內容。沒有任何自己的伺服器或資料庫。
   設定：Google Cloud Console → 建立專案 → 啟用 Google Drive API → OAuth 同意畫面（加入範圍 drive.appdata）
        → 建立「網頁應用程式」OAuth 用戶端 ID（已授權的 JavaScript 來源填你的網站網址）→ 把用戶端 ID 貼到下面。
   留空時雲端功能自動關閉，花園仍只存在這個瀏覽器（localStorage）。
   注意：Google 的存取權杖只有效約 1 小時（沒有後端就拿不到長效 refresh token），過期後下一次點擊畫面時會快速重新連線一次。 */
const GOOGLE_CLIENT_ID='907010287253-i85fg9k699sibjc375d0fti7eink03uk.apps.googleusercontent.com';
window.cloud=(()=>{
  const SCOPE='openid email profile https://www.googleapis.com/auth/drive.appdata',DRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata',FN='garden.json',TK='moodgarden.g';
  const D='https://www.googleapis.com/drive/v3/files',U='https://www.googleapis.com/upload/drive/v3/files',cfgOK=!!GOOGLE_CLIENT_ID;
  let user=null,tok=null,client=null,st='off',busy=false,again=false,timer=0,lastOk=0,lastVer=null,localDirty=false,manual=false,armed=false;
  const api={user:null,state:'off'};
  const tokOK=()=>!!(tok&&Date.now()<tok.exp-60000);
  try{const g=JSON.parse(localStorage.getItem(TK));if(g&&g.sub){user={sub:g.sub,email:g.email,name:g.name};tok=g.t?{t:g.t,exp:g.exp}:null}}catch(e){}
  api.user=user;st=!cfgOK?'off':user?(tokOK()?'syncing':'reauth'):'out';api.state=st;
  const persist=()=>{try{user?localStorage.setItem(TK,JSON.stringify({...user,t:tok&&tok.t,exp:tok&&tok.exp})):localStorage.removeItem(TK)}catch(e){}};
  const askX=(m,y,n)=>{const p=ask(m,y);$('dn').textContent=n;return p.then(v=>{$('dn').textContent=tr('keep');return v})};
  const rmFlower=d=>{if(flowers[d]){scene.remove(flowers[d]);delete flowers[d]}};
  const setSt=s=>{st=s;api.state=s;api.paint()};
  const ts=e=>e?(e.u||e.pt||0):0;

  /* ---- Drive REST ---- */
  async function gx(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tok.t,...(opt.headers||{})}});
    if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}return r}
  const list=async()=>(await(await gx(D+'?spaces=appDataFolder&orderBy=createdTime&fields='+encodeURIComponent('files(id,version)')+'&q='+encodeURIComponent("name='"+FN+"' and trashed=false"))).json()).files||[];
  const dl=async id=>{const t=await(await gx(D+'/'+id+'?alt=media')).text();try{return JSON.parse(t)||{}}catch(e){return{}}};
  async function create(body){const b='gdn'+Date.now(),meta=JSON.stringify({name:FN,parents:['appDataFolder'],mimeType:'application/json'});
    return(await gx(U+'?uploadType=multipart&fields=id,version',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
      body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})).json()}
  const update=async(id,body)=>(await gx(U+'/'+id+'?uploadType=media&fields=id,version',{method:'PATCH',headers:{'Content-Type':'application/json'},body})).json();

  /* ---- 設定頁的「帳號與同步」區塊 ---- */
  const paint0=()=>{const el=$('acc');if(!el)return;
    if(st==='off'){el.innerHTML=`<div class="si"><span class="sic ms">cloud_off</span><span class="sx"><b>${tr('cNoT')}</b><small>${tr('cNo')}</small></span></div>`;return}
    if(!user){el.innerHTML=`<div class="si col"><span class="sx"><small style="margin-bottom:10px">${tr('accD')}</small></span>
<button class="ab" data-a="google" ${client?'':'disabled'}><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>${tr('gIn')}</button></div>`;return}
    const ico={ok:'cloud_done',offline:'cloud_off',err:'error',reauth:'lock'}[st]||'cloud_sync',re=st==='reauth';
    const t=new Date(lastOk||Date.now()).toLocaleTimeString(LC(),{hour:'2-digit',minute:'2-digit'});
    const msg={ok:tr('stOk')+' · '+t,offline:tr('stOff'),err:tr('stErr'),reauth:tr('stRe')}[st]||tr('stSync');
    el.innerHTML=`<div class="si"><span class="sic ms">account_circle</span><span class="sx"><b>${esc(user.name||user.email||'Google')}</b><small>Google${user.email?' · '+esc(user.email):''}</small></span></div>
<div class="si"><span class="sic ms" style="background:${st==='err'?'#fbe0e0':'#DDEFE0'}">${ico}</span><span class="sx"><small style="opacity:.85;font-size:13px">${msg}</small></span><button class="btn" data-a="${re?'re':'sync'}">${tr(re?'cRe':'sNow')}</button></div>
<div class="si"><span class="sx"></span><button class="btn r" data-a="out">${tr('sOut')}</button></div>`};
  api.paint=()=>{paint0();const el=$('acc');if(el)el.onclick=e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
    if(a==='google')signIn();else if(a==='re')reauth();else if(a==='sync')tokOK()?sync():reauth();else if(a==='out')signOut()}};

  /* ---- 登入 / 權杖 ---- */
  function signIn(){if(!client)return;manual=true;client.requestAccessToken({prompt:'select_account'})}
  function reauth(){if(!client)return;client.requestAccessToken({prompt:'',hint:user&&user.email})}
  function arm(){if(armed||!user)return;armed=true;addEventListener('click',()=>{armed=false;if(user&&!tokOK())reauth()},{once:true,capture:true})}
  function signOut(){tok=null;user=null;api.user=null;persist();setSt('out');toast(tr('cOut'))}
  function wipeLocal(){try{GF.wipe()}catch(e){}for(const d in flowers)rmFlower(d);S.e={};S.del={};for(const d in _bj)delete _bj[d];S.wx=null;S.wxd=null;setWeather(null);try{syncCr()}catch(e){}}
  async function onTok(r){
    if(r.error){if(manual)toast(esc(tr('cFail')+' ('+r.error+')'));manual=false;return}
    if(!google.accounts.oauth2.hasGrantedAllScopes(r,DRIVE_SCOPE)){manual=false;toast(tr('cScope'));return}
    tok={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};
    try{const p=await(await gx('https://www.googleapis.com/oauth2/v3/userinfo')).json(),nu={sub:p.sub,email:p.email,name:p.name};
      if(S.uid&&S.uid!==nu.sub&&Object.keys(S.e).length){if(!await askX(tr('cMixQ'),tr('cMixY'),tr('cMixN')))wipeLocal()}
      user=nu;api.user=nu;S.uid=nu.sub;save();persist();
      if(manual){toast(tr('cIn'));manual=false}
      lastVer=null;sync()}
    catch(e){tok=null;manual=false;setSt('err')}}

  /* ---- 同步：讀雲端檔 → 逐日比較更新時間（較新的贏）→ 必要時寫回 ---- */
  function applyE(d,o){o=JSON.parse(JSON.stringify(o));S.e[d]=o;_bj[d]=_sig(o);delete S.del[d];if(ok){rmFlower(d);addFlower(d,1)}}
  function applyD(d,u){rmFlower(d);delete S.e[d];delete _bj[d];S.del[d]=u}
  async function sync(){
    if(!user)return;if(busy){again=true;return}
    if(!tokOK()){setSt('reauth');arm();return}
    busy=true;const wasDirty=localDirty;localDirty=false;if(st!=='ok')setSt('syncing');
    try{
      const fs=await list();
      if(fs.length===1&&fs[0].version===lastVer&&!wasDirty){lastOk=Date.now();setSt('ok');busy=false;return}
      const R={e:{},del:{}};
      for(const f of fs){const j=await dl(f.id);for(const d in j.e||{})if(!(d in R.e)||ts(j.e[d])>ts(R.e[d]))R.e[d]=j.e[d];for(const d in j.del||{})R.del[d]=Math.max(R.del[d]||0,j.del[d]);if(j.g)R.g=GF.mrg(R.g,j.g)}
      const out={v:1,e:{},del:{}};let touched=false,dirty=fs.length>1;
      const dates=new Set([...Object.keys(S.e),...Object.keys(S.del),...Object.keys(R.e),...Object.keys(R.del)]);
      dates.forEach(d=>{
        const le=S.e[d],lts=le?ts(le):(S.del[d]||0),a=ts(R.e[d]),b=R.del[d]||0,rts=Math.max(a,b),rIsE=a>b;
        if(rts>lts){touched=true;if(rIsE){applyE(d,R.e[d]);out.e[d]=R.e[d]}else{applyD(d,b);out.del[d]=b}}
        else if(lts>rts){dirty=true;if(le){if(!le.u)le.u=le.pt||Date.now();out.e[d]=le}else if(rts>0)out.del[d]=lts}
        else if(rts>0){if(rIsE)out.e[d]=R.e[d];else out.del[d]=b}
        else if(le){le.u=Date.now();out.e[d]=le;dirty=true}});   // 沒有任何時間資訊的舊花：補上時間後上傳
      {const gr=GF.sync(R.g);if(gr.g)out.g=gr.g;if(gr.dirty)dirty=true;if(gr.touched)touched=true}   // 禮物與裝飾品
      if(dirty||!fs.length){const body=JSON.stringify(out),r=fs.length?await update(fs[0].id,body):await create(body);lastVer=r.version;
        for(const f of fs.slice(1))gx(D+'/'+f.id,{method:'DELETE'}).catch(()=>{})}
      else lastVer=fs[0].version;
      if(touched)afterApply();else save();
      lastOk=Date.now();setSt('ok')}
    catch(e){if(e.status===401){tok=null;persist();setSt('reauth');arm()}else setSt(navigator.onLine?'err':'offline')}
    busy=false;if(again){again=false;sync()}}
  function afterApply(){
    try{if(ok)syncCr()}catch(e){}
    const t=S.e[today()];if(t&&(S.wxd!==today()||S.wx!==t.mood)){S.wx=t.mood;S.wxd=today();setWeather(t.mood)}
    if(Object.keys(S.e).length&&!$('ob').hidden)closeOb();
    save();refresh();
    if(!$('p-cal').hidden)renderCal();if(!$('p-ins').hidden)renderIns();if(!$('p-set').hidden)renderSet()}
  api.sync=sync;
  api.dirty=()=>{if(user){localDirty=true;clearTimeout(timer);timer=setTimeout(sync,1500)}};

  /* ---- 啟動 ---- */
  function init(){
    if(!cfgOK)return;
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
    s.onload=()=>{client=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPE,callback:onTok,
      error_callback:e=>{if(manual&&!/popup_closed/.test((e&&e.type)||''))toast(esc(tr('cFail')+' ('+((e&&e.type)||'')+')'));manual=false}});api.paint()};
    document.head.append(s);
    if(user){tokOK()?sync():arm()}
    setInterval(()=>{if(user&&document.visibilityState==='visible'&&navigator.onLine&&tokOK())sync()},30000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!user)return;tokOK()?sync():(setSt('reauth'),arm())});
    addEventListener('online',()=>{if(user&&tokOK())sync()});addEventListener('offline',()=>{if(user)setSt('offline')})}
  init();
  return api})();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then((reg) => {
        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      })
      .catch(() => {});
  });
}
</script>
