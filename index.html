<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>情緒花園</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F8F5EF">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="情緒花園">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/card-toast.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/icons-touch.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/sync-gifts.css">
  <link rel="stylesheet" href="css/gift-dex.css">
  <link rel="stylesheet" href="css/bottom-buttons.css">
  <link rel="stylesheet" href="css/sleep.css">
  <link rel="stylesheet" href="css/liquid-glass.css">
  <link rel="stylesheet" href="css/nickname.css">
  <link rel="stylesheet" href="css/quality.css">
</head>

<body data-v="garden">
  <canvas id="c" aria-label="3D mood garden"></canvas>
  <div id="fb" hidden data-t="fb"></div>

  <header class="top g">
    <div class="logo" id="logo">
      <span class="ms">local_florist</span> <span id="lgt">Mood Garden</span>
    </div>
    <div id="date"></div>
  </header>
  <section class="hello glass g">
    <h1 id="hi"></h1>
    <p data-t="tag"></p>
    <div class="chips">
      <span id="cnt"></span>
      <span id="mon"></span>
      <span id="wxc"></span>
      <span id="hoc" role="button" tabindex="0" hidden></span>
    </div>
  </section>
  <button class="fab g" id="fab">Record Today's Mood</button>
  <button class="fab g sec" id="arr"></button>
  <button class="fab g sec" id="gb"></button>
  <section id="card" hidden></section>

  <nav aria-label="Main">
    <span id="pill"></span>
    <button data-v="garden">
      <span class="ms">yard</span> Garden
    </button>
    <button data-v="cal">
      <span class="ms">calendar_month</span> Calendar
    </button>
    <button data-v="ins">
      <span class="ms">insights</span> Insights
    </button>
    <button data-v="set">
      <span class="ms">settings</span> Settings
    </button>
  </nav>
  <section id="p-cal" class="panel glass" hidden></section>
  <section id="p-ins" class="panel glass" hidden></section>
  <section id="p-set" class="panel glass" hidden></section>

  <div class="scrim" id="modal" hidden>
    <div class="sheet" role="dialog" aria-label="Mood check-in">
      <h2 id="mt">How are you feeling today?</h2>
      <div class="moods" id="moods"></div>
      <textarea id="txt" placeholder="What made you feel this way today?" maxlength="400"></textarea>
      <div class="tags" id="tags"></div>
      <div id="gfull" hidden></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" id="mx" data-t="cancel"></button>
        <button class="btn p" id="ms" data-sfx="off">Plant My Flower</button>
      </div>
    </div>
  </div>
  <div class="scrim" id="dlg" hidden>
    <div class="sheet" style="width:min(340px,100%)">
      <p id="dm" style="margin-bottom:16px"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" id="dn" data-t="keep"></button>
        <button class="btn r" id="dy">Confirm</button>
      </div>
    </div>
  </div>

  <div id="sl" hidden role="dialog" aria-modal="true">
    <span class="ms" aria-hidden="true">bedtime</span>
    <h1 data-t="slH"></h1>
    <p data-t="slP"></p>
    <button class="btn" id="slw" data-t="slWake" data-sfx="off"></button>
  </div>
  <div class="scrim" id="gmod" hidden>
    <div class="sheet" id="gsh" role="dialog"></div>
  </div>
  <div id="ld" role="status" aria-live="polite">
    <div class="cl" style="left:6%;top:9%"></div>
    <div class="cl" style="right:4%;top:20%;width:100px"></div>
    <div class="bud">
      <div class="st"></div>
      <div class="hd"></div>
      <div class="sm"></div>
      <div class="ck" style="left:20%"></div>
      <div class="ck" style="right:20%"></div>
    </div>
    <div class="ob-s">
      <p id="ldm" class="ldm"></p>
      <div class="ldb">
        <i id="ldi"></i>
      </div>
      <button class="btn p big" id="lde" hidden data-t="ldGo" style="font-size:18px;padding:12px 30px"></button>
    </div>
  </div>
  <div id="ob">
    <div class="cl" style="left:6%;top:9%"></div>
    <div class="cl" style="right:4%;top:20%;width:100px"></div>
    <div class="bud">
      <div class="st"></div>
      <div class="hd"></div>
      <div class="sm"></div>
      <div class="ck" style="left:20%"></div>
      <div class="ck" style="right:20%"></div>
    </div>
    <div class="ob-s">
      <h1 data-t="obH"></h1>
      <p data-t="obP"></p>
      <div class="chips" id="obc"></div>
      <button class="btn p big" id="go" data-t="go" style="font-size:18px;padding:12px 30px"></button>
      <button id="skip" data-t="skip" style="font-size:13px"></button>
    </div>
  </div>

  <script src="js/log.js"></script>
  <script src="vendor/three.r128.min.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/state.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/zh.js"></script>
  <script src="js/locales/ja.js"></script>
  <script src="js/locales/ko.js"></script>
  <script src="js/world.js"></script>
  <script src="js/three-utils.js"></script>
  <script src="js/flowers.js"></script>
  <script src="js/flower-care.js"></script>
  <script src="js/garden-scene.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/gifts.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui-shell.js"></script>
  <script src="js/views.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/river.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/withered-island.js"></script>
  <script src="js/wish.js"></script>
  <script src="js/animal-home.js"></script>
  <script src="js/nickname.js"></script>
  <script src="js/pwa.js"></script>

</body>

</html>
